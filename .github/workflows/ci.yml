name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust format, lint, test, and audit
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install libmpv
        run: brew install mpv

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web/src-tauri -> target"

      - name: Check Rust formatting
        working-directory: web/src-tauri
        run: cargo fmt --check

      - name: Run strict Rust lints
        working-directory: web/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: web/src-tauri
        run: cargo test --locked

      - name: Audit Rust dependencies
        working-directory: web/src-tauri
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the LFS pointer files in the checkout. Downloading VLCKit on
          # every push and pull request exhausted the repository owner's monthly
          # LFS bandwidth allowance.
          lfs: false

      - name: Detect native Swift changes
        id: native
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == "tag" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${BEFORE_SHA}"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
          fi

          if git diff --name-only "${base}" "${GITHUB_SHA}" | grep -Eq \
            '^(Package\.swift$|Package\.resolved$|Sources/|Tests/|Vendor/|scripts/check_swift_tests\.mjs$)'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Cache VLCKit
        id: vlckit-cache
        if: steps.native.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: Vendor/VLCKit.xcframework
          key: vlckit-lfs-${{ runner.os }}-${{ hashFiles('Vendor/VLCKit.xcframework/**') }}

      - name: Prepare VLCKit
        id: vlckit
        if: steps.native.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="Vendor/VLCKit.xcframework/macos-arm64_x86_64/VLCKit.framework/Versions/A/VLCKit"
          if grep -aq '^version https://git-lfs.github.com/spec/v1$' "${binary}"; then
            git lfs install --local
            if ! git lfs pull --include="Vendor/VLCKit.xcframework/**" --exclude=""; then
              echo "::warning::Skipping native Swift checks because VLCKit is not cached and the repository LFS budget is unavailable."
              echo "available=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          expected_sha="$(git show "HEAD:${binary}" | sed -n 's/^oid sha256://p')"
          actual_sha="$(shasum -a 256 "${binary}" | awk '{print $1}')"

          if [ -z "${expected_sha}" ] || [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "::error::The cached VLCKit binary does not match its Git LFS pointer."
            exit 1
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Select Xcode
        if: steps.native.outputs.changed == 'true' && steps.vlckit.outputs.available == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin to whatever stable Xcode the runner image ships (16.0 was removed).
          xcode-version: "latest-stable"

      - name: Build
        if: steps.native.outputs.changed == 'true' && steps.vlckit.outputs.available == 'true'
        run: swift build

      - name: Test
        if: steps.native.outputs.changed == 'true' && steps.vlckit.outputs.available == 'true'
        run: node scripts/check_swift_tests.mjs

  # The self-hosted server + web client (the Server Mode deliverable). The server
  # build (npm run build) runs the TypeScript typecheck then esbuild-bundles the
  # web runtime shims, so it also exercises the web/src files the server imports.
  server-web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Commit privacy gate tests
        run: node --test scripts/check_commit_privacy.test.mjs

      - name: Commit privacy gate
        env:
          COMMIT_PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_PRIVACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check_commit_privacy.mjs

      - name: Public repo preflight tests
        run: node --test scripts/public_repo_preflight.test.mjs

      - name: Public repo preflight
        run: node scripts/public_repo_preflight.mjs

      - name: Security decisions
        run: node scripts/check_security_decisions.mjs

      - name: Provider smoke contract tests
        run: node --test scripts/provider_smoke.test.mjs

      - name: Bundle budget verifier tests
        run: node --test scripts/check_bundle_budgets.test.mjs

      - name: Release readiness
        run: node scripts/check_release_readiness.mjs

      - name: Website download logic
        run: node scripts/check_website_download_logic.mjs

      - name: Website static QA
        run: node scripts/check_website_static.mjs

      - name: Website app - install and build
        working-directory: website-app
        run: |
          npm ci
          npm run build

      - name: Website app QA
        run: node scripts/check_website_app.mjs

      - name: Website mounted-path QA
        run: node scripts/check_website_path_mount.mjs

      - name: App responsive contract
        run: node scripts/check_app_responsive_contract.mjs

      # The server's esbuild bundle imports web TypeScript that pulls 3rd-party
      # deps (e.g. subsrt-ts) which esbuild resolves from web/node_modules - so
      # web deps must be installed BEFORE the server build.
      - name: Web - install deps
        working-directory: web
        run: npm ci

      - name: Server - install, build (typecheck + bundle), test
        working-directory: server
        run: |
          npm ci
          npm run build
          npx vitest run

      - name: Web - build (typecheck + vite), test
        working-directory: web
        run: |
          npm run build
          npx vitest run

      - name: Smoke packaged desktop server resources
        run: |
          node scripts/prepare_tauri_server_resources.mjs
          node scripts/download_tauri_node_runtime.mjs linux-x64
          node scripts/smoke_tauri_server_bundle.mjs web/src-tauri/resources/server

  tauri-android:
    name: Tauri Android compile check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      # `ring` compiles C, so cc-rs needs a cross compiler for the target. Without
      # these it looks for a bare `aarch64-linux-android-clang` on PATH, which the
      # NDK does not ship: its binaries are API-versioned, e.g.
      # aarch64-linux-android24-clang.
      - name: Export NDK and cross-compiler locations
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.2.12479018"
          test -d "$ndk"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$tc/aarch64-linux-android24-clang"
          {
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$tc/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$tc/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$tc/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
          echo "$tc" >> "$GITHUB_PATH"

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web/src-tauri -> target"
          key: android

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # `tauri android init` generates gen/android, which is not committed. It
      # needs the frontend dist to exist for the asset protocol config, so build
      # the web app first.
      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Generate the Android project
        working-directory: web
        run: npm run tauri -- android init --ci

      # The real gate. Desktop-only modules (player, keychain, server_host,
      # downloads) are cfg(desktop); this proves what remains actually compiles
      # for a phone. Checking one ABI is enough to catch cfg mistakes and is far
      # cheaper than linking all four.
      - name: Compile the Rust library for Android
        working-directory: web/src-tauri
        run: cargo check --locked --target aarch64-linux-android

      - name: Confirm the desktop build is still intact
        working-directory: web/src-tauri
        run: cargo check --locked

  android-tv:
    name: Android TV unit tests, lint, and APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Test, lint, and build Android TV
        working-directory: android-tv
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
