name: windows-private-storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-private-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  private-storage:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Bind actual source and native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = git rev-parse HEAD
          if ($source -ne '${{ github.sha }}') { throw 'Source binding failed.' }
          node -e "const fs=require('node:fs'); fs.writeFileSync(process.env.RUNNER_TEMP+'/windows-private-storage-binding.json',JSON.stringify({sourceRevision:process.argv[1],node:process.version,platform:process.platform,arch:process.arch},null,2)+'\n')" $source
      - name: Verify sanitized observer contracts
        run: node --test scripts/windows_native_observer_preload.test.mjs
      - name: Install shared web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build actual server
        id: server-build
        working-directory: server
        run: npm run build
      - name: Native private storage and writer checks
        working-directory: server
        env:
          DS_SERVER_SECRET_KEY: ''
        run: node node_modules/vitest/vitest.mjs run test/privateStorage.test.ts test/privateStorage.windows.test.ts --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$env:RUNNER_TEMP/windows-private-storage-results.json"
      - name: Full server suite on the same native runtime
        id: observer
        if: ${{ !cancelled() && steps.server-build.outcome == 'success' }}
        working-directory: server
        shell: pwsh
        env:
          DS_SERVER_SECRET_KEY: ''
          YAWF_TEST_LEASE_PHASES: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = node -e "process.stdout.write(require('node:fs').mkdtempSync(require('node:path').join(process.env.RUNNER_TEMP,'yawf-native-observer-')))"
          "directory=$directory" >> $env:GITHUB_OUTPUT
          $preload = node -e "process.stdout.write(require('node:url').pathToFileURL(require('node:path').resolve('../scripts/windows_native_observer_preload.mjs')).href)"
          $env:YAWF_NATIVE_OBSERVER_DIR = $directory
          $env:NODE_OPTIONS = ($env:NODE_OPTIONS + ' --import=' + $preload).Trim()
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$env:RUNNER_TEMP/windows-private-storage-full-results.json"
          exit $LASTEXITCODE
      - name: Retain exact native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-private-storage-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/windows-private-storage-binding.json
            ${{ steps.observer.outputs.directory || format('{0}/yawf-native-observer-unavailable', runner.temp) }}/*.jsonl
            ${{ runner.temp }}/windows-private-storage-results.json
            ${{ runner.temp }}/windows-private-storage-full-results.json
          if-no-files-found: error
          retention-days: 14
