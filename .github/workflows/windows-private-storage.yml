name: windows-private-storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-private-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  private-storage:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Bind actual source and native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = git rev-parse HEAD
          if ($source -ne '${{ github.sha }}') { throw 'Source binding failed.' }
          node --input-type=module -e "import fs from 'node:fs'; import { characterizationBinding } from './scripts/windows_native_observer_characterization.mjs'; fs.writeFileSync(process.env.RUNNER_TEMP+'/windows-private-storage-binding.json',JSON.stringify({...characterizationBinding(),sourceRevision:process.argv[1],node:process.version,platform:process.platform,arch:process.arch},null,2)+'\n')" $source
      - name: Verify sanitized observer contracts
        run: node --test scripts/windows_native_observer_preload.test.mjs scripts/windows_native_observer_characterization.test.mjs
      - name: Install shared web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build actual server
        id: server-build
        working-directory: server
        run: npm run build
      - name: Characterize one cold native call, not release qualification
        id: characterization
        if: ${{ !cancelled() && steps.server-build.outcome == 'success' }}
        working-directory: server
        shell: pwsh
        env:
          DS_SERVER_SECRET_KEY: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = node -e "process.stdout.write(require('node:fs').mkdtempSync(require('node:path').join(process.env.RUNNER_TEMP,'yawf-native-characterization-')))"
          "directory=$directory" >> $env:GITHUB_OUTPUT
          $preload = node -e "process.stdout.write(require('node:url').pathToFileURL(require('node:path').resolve('../scripts/windows_native_observer_characterization.mjs')).href)"
          Remove-Item Env:YAWF_NATIVE_OBSERVER_DIR -ErrorAction SilentlyContinue
          $env:YAWF_NATIVE_CHARACTERIZATION_DIR = $directory
          $env:NODE_OPTIONS = ($env:NODE_OPTIONS + ' --import=' + $preload).Trim()
          node node_modules/vitest/vitest.mjs run test/app.test.ts -t '^DebridStreamer server disk-backed admin health caps the admin health audit-event count at 10,000$' --testTimeout=30000 --hookTimeout=30000 --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$env:RUNNER_TEMP/windows-native-characterization-results.json"
          exit $LASTEXITCODE
      - name: Require one recorded substitution and actual native outcome
        if: ${{ !cancelled() && steps.server-build.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/windows_native_observer_characterization.mjs --check '${{ steps.characterization.outputs.directory || format('{0}/yawf-native-characterization-unavailable', runner.temp) }}' | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-native-characterization-postcheck.json"
          exit $LASTEXITCODE
      - name: Retain exact native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-characterization-windows-2022
          path: |
            ${{ runner.temp }}/windows-private-storage-binding.json
            ${{ steps.characterization.outputs.directory || format('{0}/yawf-native-characterization-unavailable', runner.temp) }}/*.jsonl
            ${{ steps.characterization.outputs.directory || format('{0}/yawf-native-characterization-unavailable', runner.temp) }}/*.json
            ${{ runner.temp }}/windows-native-characterization-results.json
            ${{ runner.temp }}/windows-native-characterization-postcheck.json
          if-no-files-found: error
          retention-days: 14
