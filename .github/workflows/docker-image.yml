name: docker-image

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "scripts/check_release_readiness.mjs"
      - "scripts/check_security_decisions.mjs"
      - "scripts/public_repo_preflight.mjs"
      - "server/**"
      - "web/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "scripts/check_release_readiness.mjs"
      - "scripts/check_security_decisions.mjs"
      - "scripts/public_repo_preflight.mjs"
      - "server/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Public repo preflight
        run: node scripts/public_repo_preflight.mjs

      - name: Release readiness
        run: node scripts/check_release_readiness.mjs

      - name: Security decisions
        run: node scripts/check_security_decisions.mjs

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve release image version
        id: release-version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${REF_NAME#v}"
          version="${version%-web}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "enabled=true"
            echo "version=$version"
            echo "major_minor=${version%.*}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load amd64 smoke image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag yawf-server-smoke:amd64 \
            --cache-from type=gha \
            .

      - name: Smoke amd64 production image
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./server/package.json').version")"
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint node \
            --mount type=bind,source="$PWD/scripts/smoke_server_artifact.mjs",target=/smoke/smoke_server_artifact.mjs,readonly \
            yawf-server-smoke:amd64 \
            /smoke/smoke_server_artifact.mjs \
            --expected-version "$expected_version" \
            --server-entry /app/server/dist/index.cjs \
            --web-dist /app/web-dist \
            | tee "$RUNNER_TEMP/yawf-server-smoke-linux-amd64.json"

      - name: Build and load arm64 smoke image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --tag yawf-server-smoke:arm64 \
            --cache-from type=gha \
            .

      - name: Smoke arm64 production image
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./server/package.json').version")"
          docker run --rm \
            --platform linux/arm64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint node \
            --mount type=bind,source="$PWD/scripts/smoke_server_artifact.mjs",target=/smoke/smoke_server_artifact.mjs,readonly \
            yawf-server-smoke:arm64 \
            /smoke/smoke_server_artifact.mjs \
            --expected-version "$expected_version" \
            --server-entry /app/server/dist/index.cjs \
            --web-dist /app/web-dist \
            | tee "$RUNNER_TEMP/yawf-server-smoke-linux-arm64.json"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.release-version.outputs.version }},enable=${{ steps.release-version.outputs.enabled }}
            type=raw,value=${{ steps.release-version.outputs.major_minor }},enable=${{ steps.release-version.outputs.enabled }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish multi-arch image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published images by immutable digest
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_NAME"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          expected_version="$(node -p "require('./server/package.json').version")"
          image="$IMAGE_NAME@$IMAGE_DIGEST"
          for architecture in amd64 arm64; do
            docker pull --platform "linux/$architecture" "$image"
            docker run --rm \
              --platform "linux/$architecture" \
              --network none \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --entrypoint node \
              --mount type=bind,source="$PWD/scripts/smoke_server_artifact.mjs",target=/smoke/smoke_server_artifact.mjs,readonly \
              "$image" \
              /smoke/smoke_server_artifact.mjs \
              --expected-version "$expected_version" \
              --server-entry /app/server/dist/index.cjs \
              --web-dist /app/web-dist \
              | tee "$RUNNER_TEMP/yawf-published-smoke-linux-$architecture.jsonl"
          done

      - name: Retain server image verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-image-smoke-receipts
          path: |
            ${{ runner.temp }}/yawf-server-smoke-linux-*.json
            ${{ runner.temp }}/yawf-published-smoke-linux-*.jsonl
          if-no-files-found: ignore
          retention-days: 7
