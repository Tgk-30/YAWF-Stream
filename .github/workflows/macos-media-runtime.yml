# One distinct fixed-source production export after an incomplete external diagnostic.
# The old observed case remains FAIL. This runs the original production gates,
# not a second observation, signing, release, recipe change or tag mutation.
name: Intel96 frozen production export

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: intel96-fixed-production-export
  cancel-in-progress: false

jobs:
  export-intel96:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'Tgk-30/YAWF-Stream' &&
      github.actor == 'Tgk-30' && github.ref == 'refs/heads/codex/desktop96-media-observe'
    name: Export frozen Intel96 production runtime, no signing
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout immutable production controls separately
        uses: actions/checkout@v4
        with:
          ref: 2edc189a33539bf1742435590810fb84aa653ce5
          path: frozen-production
          persist-credentials: false
      - name: Checkout separate receipt retention tools
        uses: actions/checkout@v4
        with:
          path: export-tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download only the already admitted corresponding source
        uses: actions/download-artifact@v4
        with:
          name: macos-media-corresponding-source
          path: ${{ runner.temp }}/frozen-corresponding-source
          github-token: ${{ github.token }}
          repository: Tgk-30/YAWF-Stream
          run-id: 42916926303
      - name: Admit immutable corresponding source and export contracts
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(git -C frozen-production rev-parse HEAD)" = 2edc189a33539bf1742435590810fb84aa653ce5
          source="$RUNNER_TEMP/frozen-corresponding-source"
          archive=yawf-macos-media-runtime-source-6c850c418e17824d70ba2dcb9bb71a1c829906d8238c3ba616981001098e941c.tar.gz
          test "$(shasum -a 256 "$source/$archive" | awk '{print $1}')" = 6c850c418e17824d70ba2dcb9bb71a1c829906d8238c3ba616981001098e941c
          /usr/bin/python3 -I -B - "$source/SOURCE-RECEIPT.json" "$archive" <<'SOURCE'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 1048576
          value = json.loads(path.read_text())
          assert value["schemaVersion"] == 1 and value["result"] == "pass" and value["licensingCleared"] is False
          assert value["archiveFile"] == sys.argv[2]
          assert value["archiveSha256"] == "6c850c418e17824d70ba2dcb9bb71a1c829906d8238c3ba616981001098e941c"
          assert value["archiveBytes"] == 456776628
          SOURCE
          /usr/bin/python3 -I -B export-tools/scripts/ci/observe_media_producer.test.py -v
          /usr/bin/python3 -I -B export-tools/scripts/ci/intel96_production_export_workflow.test.py -v
      - name: Install build tools only, not host media libraries
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake meson ninja autoconf automake libtool nasm pkgconf
          libtool_prefix="$(brew --prefix libtool)"
          test -x "$libtool_prefix/bin/glibtoolize"
          test -f "$libtool_prefix/share/aclocal/libtool.m4"
          echo "ACLOCAL_PATH=$libtool_prefix/share/aclocal${ACLOCAL_PATH:+:$ACLOCAL_PATH}" >> "$GITHUB_ENV"
      - name: Recheck the original frozen producer controls
        working-directory: frozen-production
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/macos-media-replay/replay_macos_media_sources.test.mjs \
            scripts/stage_macos_media_runtime.test.mjs \
            scripts/smoke_macos_media_runtime.test.mjs \
            scripts/prepare_macos_replay_notices.test.mjs \
            scripts/macos_media_workflow.test.mjs
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/test-home" TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C /usr/bin/python3 -B scripts/macos-media-replay/normalize_source_archive_test.py -v
          /usr/bin/python3 -I -B scripts/ci/run_macos_media_replay_experiment.test.py -v
          /usr/bin/python3 -I -B scripts/ci/produce_macos_media_runtime.test.py -v
      - name: Run the unchanged production qualification path
        id: media
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          brew_prefix="$(brew --prefix)"
          libtool_prefix="$(brew --prefix libtool)"
          developer_dir="$(/usr/bin/xcode-select -p)"
          toolchain_bin="$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          developer_bin="$developer_dir/usr/bin"
          tool_path="$(dirname "$(command -v node)"):$brew_prefix/bin:$libtool_prefix/bin:$toolchain_bin:$developer_bin:/usr/bin:/bin:/usr/sbin:/sbin"
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/frozen-production/scripts/ci/produce_macos_media_runtime.py" \
            --build \
            --source-dir "$RUNNER_TEMP/frozen-corresponding-source" \
            --workspace "$RUNNER_TEMP/media-intel96-export" \
            --arch x86_64 \
            --jobs 8 \
            --node "$(command -v node)" \
            --tool-path "$tool_path" \
            --developer-dir "$developer_dir" \
            --github-output "$GITHUB_OUTPUT"
      - name: Archive only a fully passed unsigned candidate
        shell: bash
        run: |
          set -euo pipefail
          child="$RUNNER_TEMP/media-intel96-export/owned-output/replay-x86_64-macos11"
          /usr/bin/python3 -I -B - "$child/SHIPPING-RESULTS.json" <<'CHECK'
          import json, sys
          value = json.load(open(sys.argv[1]))
          assert value == {"schemaVersion": 1, "result": "pass", "arch": "x86_64", "target": "11.0", "shippingRegularFiles": 57, "sourceSha256": "6c850c418e17824d70ba2dcb9bb71a1c829906d8238c3ba616981001098e941c"}
          CHECK
          tar -czf "$RUNNER_TEMP/macos-media-runtime-x86_64.tar.gz" -C "$child/media-candidate" .
          (cd "$RUNNER_TEMP" && shasum -a 256 macos-media-runtime-x86_64.tar.gz > macos-media-runtime-x86_64.tar.gz.sha256)
      - name: Retain unsigned verification transport, never a release
        uses: actions/upload-artifact@v4
        with:
          name: intel96-fixed-production-export-runtime
          path: |
            ${{ runner.temp }}/macos-media-runtime-x86_64.tar.gz
            ${{ runner.temp }}/macos-media-runtime-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Collect fixed allowlisted production receipts and nested phase logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - "$GITHUB_WORKSPACE/export-tools/scripts/ci/observe_media_producer.py" "$RUNNER_TEMP/media-intel96-export" "$RUNNER_TEMP/intel96-export-evidence" <<'RETAIN'
          import importlib.util, json, pathlib, sys
          spec = importlib.util.spec_from_file_location("fixed_retention", sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          evidence = pathlib.Path(sys.argv[3])
          evidence.mkdir()
          records = module.retain_files(pathlib.Path(sys.argv[2]), evidence)
          receipt = {"schemaVersion": 1, "scope": "fixed source production receipts only; no external process-history, signing or publication claim", "producerSource": "2edc189a33539bf1742435590810fb84aa653ce5", "sourceSha256": "6c850c418e17824d70ba2dcb9bb71a1c829906d8238c3ba616981001098e941c", "priorDiagnosticRun": 42955542025, "priorDiagnosticObserverValid": False, "files": records}
          (evidence / "RETENTION.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          RETAIN
      - name: Retain bounded production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel96-fixed-production-export-evidence
          path: ${{ runner.temp }}/intel96-export-evidence
          if-no-files-found: error
          retention-days: 14
