name: macOS media runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/*macos*"
      - "scripts/ci/produce_macos_media_runtime.py"
      - "scripts/ci/produce_macos_media_runtime.test.py"
      - "scripts/ci/run_macos_media_replay_experiment.py"
      - "scripts/ci/run_macos_media_replay_experiment.test.py"
      - "scripts/macos-media-replay/**"
      - "docs/MACOS_MEDIA_RUNTIME.md"
      - ".github/workflows/macos-media-runtime.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  source:
    name: Prepare one exact corresponding-source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.source.outputs.archive_sha256 }}
      archive_file: ${{ steps.source.outputs.archive_file }}
    env:
      SOURCE_RELEASE_ID: "417897650"
      SOURCE_ASSET_ID: "657879542"
      SOURCE_FILE: macos-media-runtime-arm64.tar.gz
      OUTER_SHA256: 11af8849872ae1c302b6a5fb6ba823e369648be3e9597c1ba2c5150e7a9f4d50
      INNER_SOURCE_SHA256: baf26db61e0e50011f748e2ddfe06a764972d8fd9ff5a562f50da94d2727dbff
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact pinned durable source transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          transport="$RUNNER_TEMP/source-transport"
          mkdir -p "$transport"
          gh api "repos/Tgk-30/YAWF-Stream/releases/$SOURCE_RELEASE_ID" > "$transport/source-transport-metadata.json"
          python3 -I -B scripts/ci/produce_macos_media_runtime.py \
            --verify-source-transport-metadata "$transport/source-transport-metadata.json" \
            > "$transport/transport-verification.json"
          gh api "repos/Tgk-30/YAWF-Stream/releases/assets/$SOURCE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$transport/$SOURCE_FILE"
          printf '%s  %s\n' "$OUTER_SHA256" "$SOURCE_FILE" > "$transport/$SOURCE_FILE.sha256"
      - name: Prepare and freshly admit the canonical source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/source-transport/macos-media-runtime-arm64.tar.gz" | awk '{print $1}')" = "$OUTER_SHA256"
          test "$(python3 -c 'import json; print(json.load(open("scripts/macos-media-replay/shipping-source-pins.json"))["source"]["sha256"])')" = "$INNER_SOURCE_SHA256"
          python3 -I -B scripts/ci/produce_macos_media_runtime.py \
            --prepare-source \
            --candidate-dir "$RUNNER_TEMP/source-transport" \
            --source-transport-metadata "$RUNNER_TEMP/source-transport/source-transport-metadata.json" \
            --output-dir "$RUNNER_TEMP/corresponding-source" \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain the one byte-identical source input for both native jobs
        uses: actions/upload-artifact@v4
        with:
          name: macos-media-corresponding-source
          path: ${{ runner.temp }}/corresponding-source
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build:
    needs: source
    name: Confined native ${{ matrix.arch }} media runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build tools, not host media libraries
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake meson ninja autoconf automake libtool nasm pkgconf
          libtool_prefix="$(brew --prefix libtool)"
          test -x "$libtool_prefix/bin/glibtoolize"
          test -f "$libtool_prefix/share/aclocal/libtool.m4"
          echo "ACLOCAL_PATH=$libtool_prefix/share/aclocal${ACLOCAL_PATH:+:$ACLOCAL_PATH}" >> "$GITHUB_ENV"
      - name: Download the canonical source archive
        uses: actions/download-artifact@v4
        with:
          name: macos-media-corresponding-source
          path: ${{ runner.temp }}/corresponding-source
      - name: Verify controls and unsigned packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/macos-media-replay/replay_macos_media_sources.test.mjs \
            scripts/stage_macos_media_runtime.test.mjs \
            scripts/smoke_macos_media_runtime.test.mjs \
            scripts/prepare_macos_replay_notices.test.mjs \
            scripts/macos_media_workflow.test.mjs
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/test-home" TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C /usr/bin/python3 -B scripts/macos-media-replay/normalize_source_archive_test.py -v
          /usr/bin/python3 -I -B scripts/ci/run_macos_media_replay_experiment.test.py -v
          /usr/bin/python3 -I -B scripts/ci/produce_macos_media_runtime.test.py -v
      - name: Rebuild, audit, relocate and smoke under one confinement profile
        id: media
        shell: bash
        env:
          MEDIA_ARCH: ${{ matrix.arch }}
          EXPECTED_SOURCE_SHA256: ${{ needs.source.outputs.archive_sha256 }}
          EXPECTED_SOURCE_FILE: ${{ needs.source.outputs.archive_file }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MEDIA_ARCH"
          test "$(shasum -a 256 "$RUNNER_TEMP/corresponding-source/$EXPECTED_SOURCE_FILE" | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA256"
          brew_prefix="$(brew --prefix)"
          libtool_prefix="$(brew --prefix libtool)"
          developer_dir="$(/usr/bin/xcode-select -p)"
          toolchain_bin="$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          developer_bin="$developer_dir/usr/bin"
          tool_path="$(dirname "$(command -v node)"):$brew_prefix/bin:$libtool_prefix/bin:$toolchain_bin:$developer_bin:/usr/bin:/bin:/usr/sbin:/sbin"
          /usr/bin/python3 -I -B scripts/ci/produce_macos_media_runtime.py \
            --build \
            --source-dir "$RUNNER_TEMP/corresponding-source" \
            --workspace "$RUNNER_TEMP/media-shipping-$MEDIA_ARCH" \
            --arch "$MEDIA_ARCH" \
            --jobs 8 \
            --node "$(command -v node)" \
            --tool-path "$tool_path" \
            --developer-dir "$developer_dir" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload unsigned verification candidate, not a release
        env:
          MEDIA_ARCH: ${{ matrix.arch }}
          MEDIA_STAGE: ${{ steps.media.outputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tar -czf "macos-media-runtime-$MEDIA_ARCH.tar.gz" -C "$MEDIA_STAGE" .
          shasum -a 256 "macos-media-runtime-$MEDIA_ARCH.tar.gz" > "macos-media-runtime-$MEDIA_ARCH.tar.gz.sha256"
      - name: Preserve executable modes and aliases in archived transport
        uses: actions/upload-artifact@v4
        with:
          name: macos-media-runtime-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/macos-media-runtime-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/macos-media-runtime-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded runtime failure or success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-media-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/trusted-logs
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/owned-output/replay-${{ matrix.arch }}-macos11/STATUS.json
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/owned-output/replay-${{ matrix.arch }}-macos11/TOOLCHAIN-PROBE.json
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/owned-output/replay-${{ matrix.arch }}-macos11/INSTALL-AUDIT.json
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/owned-output/replay-${{ matrix.arch }}-macos11/INSTALL-INVENTORY.json
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/owned-output/replay-${{ matrix.arch }}-macos11/SHIPPING-RESULTS.json
            ${{ runner.temp }}/media-shipping-${{ matrix.arch }}/owned-output/replay-${{ matrix.arch }}-macos11/media-smoke/RESULTS.json
          if-no-files-found: ignore
          retention-days: 14
