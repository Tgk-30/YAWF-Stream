name: windows-storage-audit
on:
  push:
    branches: [codex/windows76-storage-admission]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descriptors:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Inspect actual disposable Windows descriptors
        working-directory: server
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}\windows-storage-audit.json
        run: node --import tsx test/fixtures/windowsStorageAudit.ts "$env:AUDIT_OUTPUT"
      - name: Retain descriptor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-storage-descriptor-audit
          path: ${{ runner.temp }}/windows-storage-audit.json
          if-no-files-found: error
          retention-days: 14
