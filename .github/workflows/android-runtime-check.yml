name: Android phone runtime check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/android-runtime-check.yml
      - scripts/android_phone_runtime_check.py
      - scripts/android-runtime-instrumentation/**

permissions:
  contents: read
  actions: read

concurrency:
  group: android-phone-runtime-check
  cancel-in-progress: false

jobs:
  api30-runtime:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Signed phone APK on two fresh sequential API 30 KVM emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_RUN_ID: "39351580338"
      CANDIDATE_SOURCE_SHA: 5f26f144696ee47e3109ae35b395a8145b097d50
      CANDIDATE_APK_SHA256: bea6e80797329859c9e902f75795ba8af69086ea3b5327db584327201e65f39d
      CANDIDATE_VERSION: 2.3.24
      CANDIDATE_VERSION_CODE: "2003024"
      PUBLISHED_ANDROID_VERSION: 2.3.21
      CANDIDATE_APK: candidate/YAWF.Stream_Android_2.3.24.apk
      EVIDENCE: android-runtime-evidence
      AVD_NAME: yawf-phone-api30-runtime
      EMULATOR_SERIAL: emulator-5554
      EMULATOR_GPU: swiftshader_indirect
      WEBVIEW_SOURCE_COMMIT: c8187ca9e2dd5fd69f108c67e9aea44be37fb4e6
      WEBVIEW_GIT_BLOB_SHA1: 6df66d443a0206d856b4e01465230fb5b2acd418
      WEBVIEW_BASE64_SIZE: "122983788"
      WEBVIEW_APK_SIZE: "92237839"
      WEBVIEW_APK_SHA256: a566260ccd6cef57e43cbdc99ddf4a967da9782e75effef163940ed3e83682ef
      WEBVIEW_PACKAGE: com.android.webview
      WEBVIEW_VERSION: 91.0.4472.114
      WEBVIEW_VERSION_CODE: "447211456"

    steps:
      - name: Checkout runtime driver
        uses: actions/checkout@v4

      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          path: candidate-source

      - name: Confirm exact source and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          actual="$(git -C candidate-source rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SOURCE_SHA"
          {
            echo "sourceRevision=$actual"
            echo "candidateRunId=$CANDIDATE_RUN_ID"
            echo "acceptanceRuns=2-sequential-fresh-avds"
            echo "emulatorImage=system-images;android-30;google_apis;x86_64"
            echo "gpuBackend=$EMULATOR_GPU"
          } > "$EVIDENCE/binding.txt"

      - name: Download exact signed candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: android-phone-verification-candidate
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up pinned Gradle for the isolated instrumentation APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Install one API 30 x86_64 emulator image and verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-30" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-30;google_apis;x86_64"
          build_tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt2"
          test -x "$sdk_root/emulator/emulator"
          command -v apkanalyzer
          {
            echo "$build_tools"
            echo "$sdk_root/emulator"
            echo "$sdk_root/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Verify exact APK, manifest, source, and signer
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CANDIDATE_APK"
          printf '%s  %s\n' "$CANDIDATE_APK_SHA256" "$CANDIDATE_APK" | sha256sum -c -
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("candidate/android-update.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["version"] == os.environ["CANDIDATE_VERSION"]
          assert manifest["versionCode"] == int(os.environ["CANDIDATE_VERSION_CODE"])
          assert manifest["packageName"] == "com.tgk30.debridstreamer"
          assert manifest["sourceRevision"] == os.environ["CANDIDATE_SOURCE_SHA"]
          assert manifest["apk"]["name"] == Path(os.environ["CANDIDATE_APK"]).name
          assert manifest["apk"]["sha256"] == os.environ["CANDIDATE_APK_SHA256"]
          assert manifest["apk"]["size"] == Path(os.environ["CANDIDATE_APK"]).stat().st_size
          PY
          test "$(apkanalyzer manifest application-id "$CANDIDATE_APK")" = "com.tgk30.debridstreamer"
          test "$(apkanalyzer manifest version-name "$CANDIDATE_APK")" = "$CANDIDATE_VERSION"
          test "$(apkanalyzer manifest version-code "$CANDIDATE_APK")" = "$CANDIDATE_VERSION_CODE"
          python3 candidate-source/scripts/verify_android_apk.py \
            --apk "$CANDIDATE_APK" \
            --version "$CANDIDATE_VERSION" \
            --certificate-pin candidate-source/web/src-tauri/SIGNING_CERT_SHA256 \
            --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            | tee "$EVIDENCE/offline-verification.txt"
          apksigner verify --print-certs "$CANDIDATE_APK" \
            | sed -n '/certificate SHA-256 digest:/p' \
            > "$EVIDENCE/apk-signer.txt"

      - name: Fetch and verify the pinned CI-only WebView provider
        shell: bash
        run: |
          set -euo pipefail
          WEBVIEW_APK="$RUNNER_TEMP/yawf-ci-webview91-x86_64.apk"
          encoded="$RUNNER_TEMP/yawf-ci-webview91-x86_64.apk.base64"
          source_url="https://android.googlesource.com/platform/external/chromium-webview/+/$WEBVIEW_SOURCE_COMMIT/prebuilt/x86_64/webview.apk?format=TEXT"
          timeout 360s curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --retry 2 \
            --retry-connrefused \
            --retry-max-time 180 \
            --connect-timeout 20 \
            --max-time 120 \
            --max-filesize "$WEBVIEW_BASE64_SIZE" \
            --output "$encoded" \
            "$source_url"
          test "$(stat -c %s "$encoded")" = "$WEBVIEW_BASE64_SIZE"
          timeout 90s base64 --decode "$encoded" > "$WEBVIEW_APK"
          test "$(stat -c %s "$WEBVIEW_APK")" = "$WEBVIEW_APK_SIZE"
          printf '%s  %s\n' "$WEBVIEW_APK_SHA256" "$WEBVIEW_APK" | sha256sum -c -
          WEBVIEW_APK="$WEBVIEW_APK" \
          WEBVIEW_APK_SIZE="$WEBVIEW_APK_SIZE" \
          WEBVIEW_GIT_BLOB_SHA1="$WEBVIEW_GIT_BLOB_SHA1" \
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          apk = Path(os.environ["WEBVIEW_APK"])
          expected_size = int(os.environ["WEBVIEW_APK_SIZE"])
          digest = hashlib.sha1()
          digest.update(f"blob {expected_size}\0".encode())
          with apk.open("rb") as source:
              while chunk := source.read(1024 * 1024):
                  digest.update(chunk)
          assert apk.stat().st_size == expected_size
          assert digest.hexdigest() == os.environ["WEBVIEW_GIT_BLOB_SHA1"]
          PY
          test "$(apkanalyzer manifest application-id "$WEBVIEW_APK")" = "$WEBVIEW_PACKAGE"
          test "$(apkanalyzer manifest version-name "$WEBVIEW_APK")" = "$WEBVIEW_VERSION"
          test "$(apkanalyzer manifest version-code "$WEBVIEW_APK")" = "$WEBVIEW_VERSION_CODE"
          test "$(apkanalyzer manifest min-sdk "$WEBVIEW_APK")" = "21"
          test "$(apkanalyzer manifest target-sdk "$WEBVIEW_APK")" = "31"
          WEBVIEW_APK="$WEBVIEW_APK" python3 - <<'PY'
          import os
          import zipfile

          with zipfile.ZipFile(os.environ["WEBVIEW_APK"]) as archive:
              abis = sorted(
                  {name.split("/", 2)[1] for name in archive.namelist() if name.startswith("lib/") and name.count("/") >= 2}
              )
          assert "x86_64" in abis, abis
          assert set(abis) <= {"x86", "x86_64"}, abis
          PY
          apksigner verify --print-certs "$WEBVIEW_APK" \
            | sed -n '/certificate SHA-256 digest:/p' \
            > "$EVIDENCE/webview-provider-signer.txt"
          test -s "$EVIDENCE/webview-provider-signer.txt"
          {
            echo "sourceCommit=$WEBVIEW_SOURCE_COMMIT"
            echo "gitBlobSha1=$WEBVIEW_GIT_BLOB_SHA1"
            echo "apkBytes=$WEBVIEW_APK_SIZE"
            echo "apkSha256=$WEBVIEW_APK_SHA256"
            echo "package=$WEBVIEW_PACKAGE"
            echo "version=$WEBVIEW_VERSION"
            echo "versionCode=$WEBVIEW_VERSION_CODE"
            echo "abis=x86,x86_64"
            echo "scope=isolated-ci-only"
            echo "shippingProvider=false"
            echo "currentSecurityBrowserProof=false"
          } > "$EVIDENCE/webview-provider-download.txt"
          echo "WEBVIEW_APK=$WEBVIEW_APK" >> "$GITHUB_ENV"
          rm "$encoded"

      - name: Test the bounded UI driver
        run: python3 scripts/android_phone_runtime_check.py --self-test

      - name: Test policy mutants and build the isolated instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android-runtime-instrumentation/policy_mutation_check.py \
            | tee "$EVIDENCE/instrumentation-policy-mutations.json"
          gradle \
            --project-dir scripts/android-runtime-instrumentation \
            --no-daemon \
            --max-workers=2 \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest
          app_apk="scripts/android-runtime-instrumentation/app/build/outputs/apk/debug/app-debug.apk"
          test_apk="scripts/android-runtime-instrumentation/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -f "$app_apk"
          test -f "$test_apk"
          {
            sha256sum "$app_apk" "$test_apk"
            echo "agp=9.3.1"
            echo "gradle=9.6.1"
            echo "androidxTestRunner=1.7.0"
            echo "androidxTestExtJunit=1.3.0"
            echo "androidxUiAutomator=2.3.0"
            echo "uiautomatorDocs=https://developer.android.com/training/testing/other-components/ui-automator-legacy"
            echo "androidxTestDocs=https://developer.android.com/jetpack/androidx/releases/test"
          } > "$EVIDENCE/instrumentation-build.txt"
          test "$(apkanalyzer manifest application-id "$app_apk")" = "com.yawf.runtimeinstrumentation"
          test "$(apkanalyzer manifest application-id "$test_apk")" = "com.yawf.runtimeinstrumentation.test"
          apkanalyzer manifest print "$app_apk" > "$EVIDENCE/instrumentation-app-manifest.xml"
          apkanalyzer manifest print "$test_apk" > "$EVIDENCE/instrumentation-test-manifest.xml"
          if grep -Eqi 'INTERNET|BIND_ACCESSIBILITY_SERVICE|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE' \
            "$EVIDENCE/instrumentation-app-manifest.xml" "$EVIDENCE/instrumentation-test-manifest.xml"; then
            echo "::error::The isolated instrumentation APK requested a forbidden permission" >&2
            exit 1
          fi
          grep -F 'androidx.test.runner.AndroidJUnitRunner' \
            "$EVIDENCE/instrumentation-test-manifest.xml"
          grep -F 'com.yawf.runtimeinstrumentation' \
            "$EVIDENCE/instrumentation-test-manifest.xml"
          runtime_test_source="scripts/android-runtime-instrumentation/app/src/androidTest/java/com/yawf/runtimeinstrumentation/RuntimeFlowTest.java"
          grep -F 'instrumentation.getTargetContext().startActivity(intent)' "$runtime_test_source"
          grep -F 'targetContext.getFilesDir()' "$runtime_test_source"
          if grep -Fq 'instrumentation.getContext().startActivity(intent)' "$runtime_test_source" || \
            grep -Fq 'getExternalFilesDir' "$runtime_test_source"; then
            echo "::error::The isolated harness regressed to a mismatched UID context or external evidence." >&2
            exit 1
          fi
          echo "HARNESS_APP_APK=$app_apk" >> "$GITHUB_ENV"
          echo "HARNESS_TEST_APK=$test_apk" >> "$GITHUB_ENV"

      - name: Run the persistent flow on two fresh sequential API 30 emulators
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          test -r /dev/kvm -a -w /dev/kvm
          stat -c 'kvmOwner=%u kvmGroup=%g kvmMode=%a' /dev/kvm > "$EVIDENCE/kvm.txt"

          export ANDROID_USER_HOME="$RUNNER_TEMP/yawf-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          command -v avdmanager | tee "$EVIDENCE/avdmanager-path.txt"
          sdkmanager --version | tee "$EVIDENCE/sdkmanager-version.txt"
          emulator_bin="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/emulator/emulator"
          qemu_bin="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          ldd "$emulator_bin" | tee "$EVIDENCE/emulator-ldd.txt"
          ldd "$qemu_bin" | tee "$EVIDENCE/qemu-ldd.txt"
          if grep -q 'not found' "$EVIDENCE/emulator-ldd.txt"; then
            echo "::error::Android emulator launcher dependencies are missing" >&2
            exit 1
          fi
          emulator -version | tee "$EVIDENCE/emulator-version.txt"

          CURRENT_EVIDENCE=""
          CURRENT_PID=""

          stop_current() {
            set +e
            if [ -z "$CURRENT_PID" ]; then
              return 0
            fi
            timeout 10s adb -s "$EMULATOR_SERIAL" emu kill >/dev/null 2>&1
            for _ in 1 2 3 4 5; do
              if ! adb devices | awk -v serial="$EMULATOR_SERIAL" '$1 == serial { found = 1 } END { exit found ? 0 : 1 }'; then
                echo "emulatorStopped=true" > "$CURRENT_EVIDENCE/cleanup.txt"
                wait "$CURRENT_PID" 2>/dev/null || true
                CURRENT_PID=""
                set -e
                return 0
              fi
              sleep 2
            done
            kill "$CURRENT_PID" 2>/dev/null || true
            sleep 2
            if adb devices | awk -v serial="$EMULATOR_SERIAL" '$1 == serial { found = 1 } END { exit found ? 0 : 1 }'; then
              echo "emulatorStopped=false" > "$CURRENT_EVIDENCE/cleanup.txt"
              set -e
              return 1
            fi
            echo "emulatorStopped=true" > "$CURRENT_EVIDENCE/cleanup.txt"
            CURRENT_PID=""
            set -e
          }

          collect_current_failure() {
            set +e
            if [ -z "$CURRENT_EVIDENCE" ]; then
              echo "evidenceCollection=notStarted" > "$EVIDENCE/workflow-failure-receipt.txt"
              return 0
            fi
            mkdir -p "$CURRENT_EVIDENCE"
            timeout 20s adb -s "$EMULATOR_SERIAL" exec-out screencap -p > "$CURRENT_EVIDENCE/workflow-failure.png"
            timeout 20s adb -s "$EMULATOR_SERIAL" shell dumpsys activity activities \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$CURRENT_EVIDENCE/workflow-failure-activity.txt"
            timeout 20s adb -s "$EMULATOR_SERIAL" logcat -d -v threadtime \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$CURRENT_EVIDENCE/workflow-failure-logcat.txt"
            timeout 20s adb -s "$EMULATOR_SERIAL" shell dumpsys dropbox --print data_app_anr \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$CURRENT_EVIDENCE/workflow-failure-anr.txt"
            timeout 30s adb -s "$EMULATOR_SERIAL" shell dumpsys SurfaceFlinger \
              | head -c 1048576 \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$CURRENT_EVIDENCE/workflow-failure-surfaceflinger.txt"
            echo "evidenceCollection=attempted" > "$CURRENT_EVIDENCE/workflow-failure-receipt.txt"
          }

          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              collect_current_failure
            fi
            stop_current || status=1
            exit "$status"
          }
          trap on_exit EXIT

          for run_number in 1 2; do
            CURRENT_EVIDENCE="$EVIDENCE/run-$run_number"
            mkdir -p "$CURRENT_EVIDENCE"
            printf '%s\n' "$run_number" > "$EVIDENCE/current-run.txt"
            run_avd="$AVD_NAME-$run_number"
            {
              echo "acceptanceRun=$run_number"
              echo "avdName=$run_avd"
              echo "freshOwnedEmulator=true"
            } > "$CURRENT_EVIDENCE/run-binding.txt"

            if adb devices | awk 'NR > 1 && $2 == "device" { found = 1 } END { exit found ? 0 : 1 }'; then
              echo "::error::An Android device was already attached before run $run_number." >&2
              exit 1
            fi
            printf 'no\n' | avdmanager create avd \
              --force \
              --name "$run_avd" \
              --package "system-images;android-30;google_apis;x86_64" \
              --device "pixel" \
              --path "$ANDROID_AVD_HOME/$run_avd" \
              2>&1 | tee "$CURRENT_EVIDENCE/avd-create.txt"
            emulator -list-avds 2>&1 | tee "$CURRENT_EVIDENCE/avd-list.txt"
            grep -Fx "$run_avd" "$CURRENT_EVIDENCE/avd-list.txt"

            nohup emulator \
              -avd "$run_avd" \
              -port 5554 \
              -accel on \
              -gpu "$EMULATOR_GPU" \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -no-snapshot \
              -camera-back none \
              -camera-front none \
              -cores 2 \
              -memory 2048 \
              > "$CURRENT_EVIDENCE/emulator.log" 2>&1 &
            CURRENT_PID=$!
            printf '%s\n' "$CURRENT_PID" > "$CURRENT_EVIDENCE/emulator.pid"
            printf '%s\n' "$CURRENT_PID" > "$EVIDENCE/current-emulator.pid"

            deadline=$((SECONDS + 240))
            until [ "$(adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null || true)" = "device" ] && \
              [ "$(adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Fresh emulator $run_number did not boot before the deadline" >&2
                exit 1
              fi
              sleep 2
            done
            api_level="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')"
            build_type="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.type | tr -d '\r')"
            test "$api_level" = "30"
            test "$build_type" = "userdebug"
            {
              echo "apiLevel=$api_level"
              echo "buildType=$build_type"
              echo "freshOwnedEmulator=true"
            } > "$CURRENT_EVIDENCE/webview-emulator-precondition.txt"

            adb -s "$EMULATOR_SERIAL" shell dumpsys webviewupdate \
              > "$CURRENT_EVIDENCE/webview-provider-stock.txt"
            timeout 180s adb -s "$EMULATOR_SERIAL" install --no-streaming -r "$WEBVIEW_APK" \
              | tee "$CURRENT_EVIDENCE/webview-provider-install.txt"
            grep -Eq '^Success\r?$' "$CURRENT_EVIDENCE/webview-provider-install.txt"
            adb -s "$EMULATOR_SERIAL" shell cmd webviewupdate set-webview-implementation "$WEBVIEW_PACKAGE" \
              > "$CURRENT_EVIDENCE/webview-provider-select.txt"
            sleep 2
            adb -s "$EMULATOR_SERIAL" shell dumpsys webviewupdate \
              > "$CURRENT_EVIDENCE/webview-provider-after.txt"
            adb -s "$EMULATOR_SERIAL" shell dumpsys package "$WEBVIEW_PACKAGE" \
              > "$CURRENT_EVIDENCE/webview-provider-package.txt"
            RUN_EVIDENCE="$CURRENT_EVIDENCE" python3 - <<'PYVERIFY'
          import os
          import re
          from pathlib import Path

          evidence = Path(os.environ["RUN_EVIDENCE"])
          current = (evidence / "webview-provider-after.txt").read_text()
          match = re.search(
              r"Current WebView package \(name, version\): \(([^,]+),\s*([^)]+)\)",
              current,
          )
          assert match is not None
          assert match.group(1).strip() == os.environ["WEBVIEW_PACKAGE"]
          assert match.group(2).strip() == os.environ["WEBVIEW_VERSION"]
          package_dump = (evidence / "webview-provider-package.txt").read_text()
          assert re.search(rf"\bversionCode={re.escape(os.environ['WEBVIEW_VERSION_CODE'])}\b", package_dump)
          assert re.search(rf"\bversionName={re.escape(os.environ['WEBVIEW_VERSION'])}(?:\s|$)", package_dump)
          PYVERIFY
            provider_path="$(adb -s "$EMULATOR_SERIAL" shell pm path "$WEBVIEW_PACKAGE" \
              | tr -d '\r' | sed -n 's/^package://p' | head -n 1)"
            test -n "$provider_path"
            installed_sha="$(adb -s "$EMULATOR_SERIAL" shell sha256sum "$provider_path" | awk '{print $1}')"
            test "$installed_sha" = "$WEBVIEW_APK_SHA256"
            echo "installedApkSha256=$installed_sha" \
              > "$CURRENT_EVIDENCE/webview-provider-installed.txt"

            timeout 120s adb -s "$EMULATOR_SERIAL" install --no-streaming -r "$HARNESS_APP_APK" \
              | tee "$CURRENT_EVIDENCE/instrumentation-app-install.txt"
            grep -Eq '^Success\r?$' "$CURRENT_EVIDENCE/instrumentation-app-install.txt"
            timeout 120s adb -s "$EMULATOR_SERIAL" install --no-streaming -r -t "$HARNESS_TEST_APK" \
              | tee "$CURRENT_EVIDENCE/instrumentation-test-install.txt"
            grep -Eq '^Success\r?$' "$CURRENT_EVIDENCE/instrumentation-test-install.txt"
            adb -s "$EMULATOR_SERIAL" shell pm list instrumentation \
              | tee "$CURRENT_EVIDENCE/instrumentation-registered.txt"
            grep -F \
              'instrumentation:com.yawf.runtimeinstrumentation.test/androidx.test.runner.AndroidJUnitRunner (target=com.yawf.runtimeinstrumentation)' \
              "$CURRENT_EVIDENCE/instrumentation-registered.txt"

            python3 scripts/android_phone_runtime_check.py \
              --adb adb \
              --serial "$EMULATOR_SERIAL" \
              --apk "$CANDIDATE_APK" \
              --evidence "$CURRENT_EVIDENCE" \
              --expected-sha256 "$CANDIDATE_APK_SHA256" \
              --expected-version "$CANDIDATE_VERSION" \
              --expected-version-code "$CANDIDATE_VERSION_CODE" \
              --expected-published-version "$PUBLISHED_ANDROID_VERSION" \
              --minimum-webview-major 90 \
              --expected-webview-package "$WEBVIEW_PACKAGE" \
              --expected-webview-version "$WEBVIEW_VERSION" \
              --boot-timeout 60 \
              --ui-timeout 60 \
              --update-timeout 120

            stop_current
          done
          trap - EXIT
      - name: Preserve bounded failure evidence
        if: failure()
        shell: bash
        run: |
          set +e
          set -o pipefail
          cap_one_mib() {
            python3 -c '
          import sys
          remaining = 1048576
          while chunk := sys.stdin.buffer.read(65536):
              if remaining:
                  kept = chunk[:remaining]
                  sys.stdout.buffer.write(kept)
                  remaining -= len(kept)
          '
          }
          mkdir -p "$EVIDENCE"
          if ! command -v adb >/dev/null 2>&1; then
            {
              echo "evidenceCollection=notStarted"
              echo "reason=adb-unavailable"
            } > "$EVIDENCE/workflow-failure-receipt.txt"
            exit 0
          fi
          if [ ! -f "$EVIDENCE/current-emulator.pid" ]; then
            {
              echo "evidenceCollection=notStarted"
              echo "reason=emulator-not-started"
            } > "$EVIDENCE/workflow-failure-receipt.txt"
            exit 0
          fi
          current_evidence="$EVIDENCE"
          if [ -s "$EVIDENCE/current-run.txt" ]; then
            current_evidence="$EVIDENCE/run-$(cat "$EVIDENCE/current-run.txt")"
          fi
          mkdir -p "$current_evidence"
          # The primary step's EXIT trap already captured evidence and stopped
          # its emulator. Preserve that completed capture even if a device still
          # reports connected while the duplicate failure step starts.
          if [ -f "$current_evidence/workflow-failure-receipt.txt" ]; then
            {
              echo "evidenceCollection=preserved"
              echo "reason=primary-exit-trap-already-captured"
            } > "$EVIDENCE/workflow-failure-receipt.txt"
            exit 0
          fi
          if [ "$(timeout 5s adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null)" != "device" ]; then
            {
              echo "evidenceCollection=preserved"
              echo "reason=emulator-already-stopped-or-unavailable"
            } > "$EVIDENCE/workflow-failure-receipt.txt"
            exit 0
          fi
          capture="$current_evidence/.workflow-failure.png.tmp"
          if timeout 20s adb -s "$EMULATOR_SERIAL" exec-out screencap -p > "$capture" && [ -s "$capture" ]; then
            mv -f "$capture" "$current_evidence/workflow-failure.png"
          else
            rm -f "$capture"
          fi
          capture="$current_evidence/.workflow-failure-activity.txt.tmp"
          if timeout 20s adb -s "$EMULATOR_SERIAL" shell dumpsys activity activities \
            | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
            > "$capture" && [ -s "$capture" ]; then
            mv -f "$capture" "$current_evidence/workflow-failure-activity.txt"
          else
            rm -f "$capture"
          fi
          capture="$current_evidence/.workflow-failure-logcat.txt.tmp"
          if timeout 20s adb -s "$EMULATOR_SERIAL" logcat -d -v threadtime \
            | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
            > "$capture" && [ -s "$capture" ]; then
            mv -f "$capture" "$current_evidence/workflow-failure-logcat.txt"
          else
            rm -f "$capture"
          fi
          capture="$current_evidence/.workflow-failure-anr.txt.tmp"
          if timeout 20s adb -s "$EMULATOR_SERIAL" shell dumpsys dropbox --print data_app_anr \
            | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
            > "$capture" && [ -s "$capture" ]; then
            mv -f "$capture" "$current_evidence/workflow-failure-anr.txt"
          else
            rm -f "$capture"
          fi
          capture="$current_evidence/.workflow-failure-surfaceflinger.txt.tmp"
          if timeout 30s adb -s "$EMULATOR_SERIAL" shell dumpsys SurfaceFlinger \
            | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
            | cap_one_mib \
            > "$capture" && [ -s "$capture" ]; then
            mv -f "$capture" "$current_evidence/workflow-failure-surfaceflinger.txt"
          else
            rm -f "$capture"
          fi
          echo "evidenceCollection=attempted" > "$current_evidence/workflow-failure-receipt.txt"

      - name: Stop the owned emulator
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE"
          if [ ! -f "$EVIDENCE/current-emulator.pid" ]; then
            echo "emulatorState=notStarted" > "$EVIDENCE/final-cleanup.txt"
            exit 0
          fi
          if ! command -v adb >/dev/null 2>&1; then
            kill "$(cat "$EVIDENCE/current-emulator.pid")" 2>/dev/null || true
            {
              echo "emulatorState=started"
              echo "cleanupState=failed"
              echo "processSignalAttempted=true"
              echo "reason=adb-unavailable"
            } > "$EVIDENCE/final-cleanup.txt"
            echo "::error::ADB is unavailable after the emulator was started."
            exit 1
          fi
          timeout 10s adb -s "$EMULATOR_SERIAL" emu kill
          for _ in 1 2 3 4 5; do
            if ! adb devices | awk -v serial="$EMULATOR_SERIAL" '$1 == serial { found = 1 } END { exit found ? 0 : 1 }'; then
              echo "emulatorStopped=true" > "$EVIDENCE/final-cleanup.txt"
              exit 0
            fi
            sleep 2
          done
          kill "$(cat "$EVIDENCE/current-emulator.pid")" 2>/dev/null || true
          sleep 2
          if adb devices | awk -v serial="$EMULATOR_SERIAL" '$1 == serial { found = 1 } END { exit found ? 0 : 1 }'; then
            echo "emulatorStopped=false" > "$EVIDENCE/final-cleanup.txt"
            echo "::error::The owned emulator did not stop."
            exit 1
          fi
          echo "emulatorStopped=true" > "$EVIDENCE/final-cleanup.txt"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-api30-runtime-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
