name: Android current API runtime check

on:
  workflow_dispatch:
    inputs:
      permission_fixture:
        description: Run the isolated updater lifecycle fixtures instead of the production APK admission
        type: boolean
        required: true
        default: false
      external_player_fixture:
        description: Test the exact public phone59 external-player flow with its exact released web UI and server source on a fresh supported API36 emulator
        type: boolean
        required: true
        default: false
      touch_player_fixture:
        description: Test the shared touch player with the immutable signed phone59 candidate and exact phone59 web UI fixture
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-current-runtime-check-${{ github.ref }}-${{ inputs.touch_player_fixture && 'touch-player' || inputs.external_player_fixture && 'external' || inputs.permission_fixture && 'fixture' || 'production' }}
  cancel-in-progress: false

jobs:
  api36-current-runtime:
    if: github.ref_type == 'branch' && inputs.permission_fixture != true && inputs.external_player_fixture != true && inputs.touch_player_fixture != true
    name: Signed phone APK on one fresh API 36 KVM emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Replace this fixed block together when a later signed candidate is reviewed.
      CANDIDATE_RUN_ID: "39857024891"
      CANDIDATE_SOURCE_SHA: e7e2b7796684bf437bb10fdc9fc51263a8ba016a
      CANDIDATE_APK_SHA256: 23587726b3ad4f2a82f4a89bd568f6c9680c1ea2a7680d41eb4b0a5475e614b3
      CANDIDATE_VERSION: 2.3.31
      CANDIDATE_VERSION_CODE: "2003031"
      PUBLISHED_ANDROID_VERSION: 2.3.27
      CANDIDATE_ARTIFACT: android-phone-verification-candidate
      CANDIDATE_APK: candidate/YAWF.Stream_Android_2.3.31.apk
      SYSTEM_IMAGE_PACKAGE: system-images;android-36;google_apis;x86_64
      AVD_NAME: yawf-phone-api36-current-runtime
      EMULATOR_SERIAL: emulator-5554
      EMULATOR_GPU: swiftshader_indirect
      EVIDENCE: android-current-runtime-evidence

    steps:
      - name: Checkout runtime driver
        uses: actions/checkout@v4

      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          path: candidate-source

      - name: Confirm exact source and evidence scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          actual="$(git -C candidate-source rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SOURCE_SHA"
          {
            echo "sourceRevision=$actual"
            echo "candidateRunId=$CANDIDATE_RUN_ID"
            echo "acceptanceRuns=1-fresh-avd"
            echo "emulatorImage=$SYSTEM_IMAGE_PACKAGE"
            echo "gpuBackend=$EMULATOR_GPU"
            echo "supplementaryCurrentApiCoverage=true"
            echo "arm16KiBProof=false"
            echo "otaTransactionProof=false"
            echo "latestWebViewSecurityProof=false"
          } > "$EVIDENCE/binding.txt"

      - name: Download exact signed candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up pinned Gradle for the isolated instrumentation APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Verify official API 36 image metadata and install exact tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          timeout 180s sdkmanager --list --channel=0 > "$EVIDENCE/sdkmanager-official-metadata.txt"
          SDK_METADATA="$EVIDENCE/sdkmanager-official-metadata.txt" \
          SDK_ADMISSION_RECEIPT="$EVIDENCE/system-image-metadata-admission.txt" \
          SYSTEM_IMAGE_PACKAGE="$SYSTEM_IMAGE_PACKAGE" python3 - <<'PY'
          # BEGIN OFFICIAL_SYSTEM_IMAGE_METADATA_POLICY
          import os
          from pathlib import Path

          metadata = Path(os.environ["SDK_METADATA"]).read_text()
          package = os.environ["SYSTEM_IMAGE_PACKAGE"]
          sections = set()
          section = None
          for line in metadata.splitlines():
              heading = line.strip().casefold()
              if heading == "installed packages:":
                  section = "installed"
                  continue
              if heading == "available packages:":
                  section = "available"
                  continue
              if heading == "available updates:":
                  section = None
                  continue
              if section is None or "|" not in line:
                  continue
              path = line.split("|", 1)[0].strip()
              if path == package:
                  sections.add(section)
          assert sections, f"official SDK metadata did not advertise exact path {package}"
          receipt = Path(os.environ["SDK_ADMISSION_RECEIPT"])
          receipt.write_text(
              f"package={package}\n"
              f"metadataSections={','.join(sorted(sections))}\n"
              "exactPathRow=true\n"
          )
          # END OFFICIAL_SYSTEM_IMAGE_METADATA_POLICY
          PY
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "$SYSTEM_IMAGE_PACKAGE"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$sdk_root/build-tools/36.0.0"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt2"
          test -x "$sdk_root/emulator/emulator"
          command -v apkanalyzer
          timeout 120s sdkmanager --list_installed --channel=0 \
            > "$EVIDENCE/sdkmanager-installed.txt"
          grep -F "$SYSTEM_IMAGE_PACKAGE" "$EVIDENCE/sdkmanager-installed.txt"
          image_root="$sdk_root/system-images/android-36/google_apis/x86_64"
          test -f "$image_root/package.xml"
          test -f "$image_root/source.properties"
          sha256sum "$image_root/package.xml" "$image_root/source.properties" \
            > "$EVIDENCE/system-image-metadata-sha256.txt"
          {
            echo "$build_tools"
            echo "$sdk_root/emulator"
            echo "$sdk_root/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Verify exact APK and production signer
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CANDIDATE_APK"
          printf '%s  %s\n' "$CANDIDATE_APK_SHA256" "$CANDIDATE_APK" | sha256sum -c -
          test "$(apkanalyzer manifest application-id "$CANDIDATE_APK")" = "com.tgk30.debridstreamer"
          test "$(apkanalyzer manifest version-name "$CANDIDATE_APK")" = "$CANDIDATE_VERSION"
          test "$(apkanalyzer manifest version-code "$CANDIDATE_APK")" = "$CANDIDATE_VERSION_CODE"
          python3 candidate-source/scripts/verify_android_apk.py \
            --apk "$CANDIDATE_APK" \
            --version "$CANDIDATE_VERSION" \
            --certificate-pin candidate-source/web/src-tauri/SIGNING_CERT_SHA256 \
            --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            | tee "$EVIDENCE/offline-verification.txt"
          apksigner verify --print-certs "$CANDIDATE_APK" \
            | sed -n '/certificate SHA-256 digest:/p' \
            > "$EVIDENCE/apk-signer.txt"
          test -s "$EVIDENCE/apk-signer.txt"
          local_metadata_dir="$(pwd)/$EVIDENCE/local-generated-verification-metadata"
          mkdir -p "$local_metadata_dir"
          node candidate-source/scripts/build_android_update_manifest.mjs \
            --apk "$CANDIDATE_APK" \
            --version "$CANDIDATE_VERSION" \
            --source "$CANDIDATE_SOURCE_SHA" \
            --output "$local_metadata_dir/android-update.json"
          printf '%s  %s\n' "$CANDIDATE_APK_SHA256" "$(basename "$CANDIDATE_APK")" \
            > "$local_metadata_dir/SHA256SUMS"
          (
            cd "$(dirname "$CANDIDATE_APK")"
            sha256sum -c "$local_metadata_dir/SHA256SUMS"
          )
          {
            echo "classification=locally-generated-runtime-verification-metadata"
            echo "releaseAsset=false"
            echo "otaPublicationEvidence=false"
            echo "sourceRevision=$CANDIDATE_SOURCE_SHA"
            echo "candidateRunId=$CANDIDATE_RUN_ID"
          } > "$local_metadata_dir/PROVENANCE.txt"

      - name: Test driver policy and build isolated instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android_phone_runtime_check.py --self-test
          python3 scripts/android-runtime-instrumentation/policy_mutation_check.py \
            | tee "$EVIDENCE/instrumentation-policy-mutations.json"
          gradle \
            --project-dir scripts/android-runtime-instrumentation \
            --no-daemon \
            --max-workers=2 \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest
          app_apk="scripts/android-runtime-instrumentation/app/build/outputs/apk/debug/app-debug.apk"
          test_apk="scripts/android-runtime-instrumentation/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -f "$app_apk"
          test -f "$test_apk"
          sha256sum "$app_apk" "$test_apk" > "$EVIDENCE/instrumentation-apk-sha256.txt"
          test "$(apkanalyzer manifest application-id "$app_apk")" = "com.yawf.runtimeinstrumentation"
          test "$(apkanalyzer manifest application-id "$test_apk")" = "com.yawf.runtimeinstrumentation.test"
          apkanalyzer manifest print "$app_apk" > "$EVIDENCE/instrumentation-app-manifest.xml"
          apkanalyzer manifest print "$test_apk" > "$EVIDENCE/instrumentation-test-manifest.xml"
          if grep -Eqi 'INTERNET|BIND_ACCESSIBILITY_SERVICE|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE' \
            "$EVIDENCE/instrumentation-app-manifest.xml" "$EVIDENCE/instrumentation-test-manifest.xml"; then
            echo "::error::The isolated instrumentation APK requested a forbidden permission" >&2
            exit 1
          fi
          echo "HARNESS_APP_APK=$app_apk" >> "$GITHUB_ENV"
          echo "HARNESS_TEST_APK=$test_apk" >> "$GITHUB_ENV"

      - name: Run persistent flow on one fresh stock API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          test -r /dev/kvm -a -w /dev/kvm
          stat -c 'kvmOwner=%u kvmGroup=%g kvmMode=%a' /dev/kvm > "$EVIDENCE/kvm.txt"

          export ANDROID_USER_HOME="$RUNNER_TEMP/yawf-current-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$EVIDENCE/run-1"
          run_evidence="$EVIDENCE/run-1"
          emulator_pid=""

          collect_failure() {
            set +e
            if [ "$(timeout 5s adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null)" != "device" ]; then
              echo "evidenceCollection=emulator-unavailable" > "$run_evidence/workflow-failure-receipt.txt"
              return 0
            fi
            timeout 20s adb -s "$EMULATOR_SERIAL" exec-out screencap -p \
              > "$run_evidence/workflow-failure.png" || true
            timeout 20s adb -s "$EMULATOR_SERIAL" shell dumpsys activity activities \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$run_evidence/workflow-failure-activity.txt" || true
            timeout 20s adb -s "$EMULATOR_SERIAL" logcat -d -v threadtime \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$run_evidence/workflow-failure-logcat.txt" || true
            timeout 20s adb -s "$EMULATOR_SERIAL" shell dumpsys dropbox --print data_app_anr \
              | sed -E 's#https?://[^ ]+#<redacted-url>#g' \
              > "$run_evidence/workflow-failure-anr.txt" || true
            echo "evidenceCollection=attempted" > "$run_evidence/workflow-failure-receipt.txt"
          }

          stop_owned_emulator() {
            set +e
            if [ -z "$emulator_pid" ]; then
              echo "emulatorStopped=not-started" > "$run_evidence/cleanup.txt"
              return 0
            fi
            timeout 10s adb -s "$EMULATOR_SERIAL" emu kill >/dev/null 2>&1 || true
            for _ in 1 2 3 4 5; do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                wait "$emulator_pid" 2>/dev/null || true
                echo "emulatorStopped=true" > "$run_evidence/cleanup.txt"
                emulator_pid=""
                return 0
              fi
              sleep 2
            done
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            echo "emulatorStopped=true-forced-owned-pid" > "$run_evidence/cleanup.txt"
            emulator_pid=""
          }

          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              collect_failure
            fi
            stop_owned_emulator
            exit "$status"
          }
          trap on_exit EXIT

          if adb devices | awk 'NR > 1 && $2 == "device" { found = 1 } END { exit found ? 0 : 1 }'; then
            echo "::error::An Android device was already attached before the owned run." >&2
            exit 1
          fi
          printf 'no\n' | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE_PACKAGE" \
            --device pixel \
            --path "$ANDROID_AVD_HOME/$AVD_NAME" \
            2>&1 | tee "$run_evidence/avd-create.txt"
          emulator -list-avds | tee "$run_evidence/avd-list.txt"
          grep -Fx "$AVD_NAME" "$run_evidence/avd-list.txt"
          emulator -version | tee "$run_evidence/emulator-version.txt"

          nohup emulator \
            -avd "$AVD_NAME" \
            -port 5554 \
            -accel on \
            -gpu "$EMULATOR_GPU" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -camera-back none \
            -camera-front none \
            -cores 2 \
            -memory 2048 \
            > "$run_evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          printf '%s\n' "$emulator_pid" > "$run_evidence/emulator.pid"

          deadline=$((SECONDS + 300))
          until [ "$(adb -s "$EMULATOR_SERIAL" get-state 2>/dev/null || true)" = "device" ] && \
            [ "$(adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The fresh API 36 emulator did not boot before the deadline" >&2
              exit 1
            fi
            sleep 2
          done

          api_level="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')"
          primary_abi="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.product.cpu.abi | tr -d '\r')"
          abi_list="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          page_size="$(adb -s "$EMULATOR_SERIAL" shell getconf PAGE_SIZE | tr -d '\r')"
          build_type="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.type | tr -d '\r')"
          fingerprint="$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.fingerprint | tr -d '\r')"
          test "$api_level" = "36"
          test "$primary_abi" = "x86_64"
          test "$page_size" = "4096"
          {
            echo "apiLevel=$api_level"
            echo "primaryAbi=$primary_abi"
            echo "abiList=$abi_list"
            echo "pageSize=$page_size"
            echo "buildType=$build_type"
            echo "buildFingerprint=$fingerprint"
            echo "systemImagePackage=$SYSTEM_IMAGE_PACKAGE"
            echo "freshOwnedEmulator=true"
            echo "abiListClassification=informational-only"
            echo "arm16KiBProof=false"
          } > "$run_evidence/device-binding.txt"

          adb -s "$EMULATOR_SERIAL" shell dumpsys webviewupdate \
            > "$run_evidence/stock-webview-provider.txt"
          PROVIDER_DUMP="$run_evidence/stock-webview-provider.txt" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          value = Path(os.environ["PROVIDER_DUMP"]).read_text()
          match = re.search(
              r"Current WebView package \(name, version\): \(([^,]+),\s*([^)]+)\)",
              value,
          )
          assert match is not None, "current stock WebView provider is missing"
          package = match.group(1).strip()
          version = match.group(2).strip()
          assert re.fullmatch(r"[A-Za-z0-9._]+", package), package
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", version), version
          major = int(version.split(".", 1)[0])
          assert major >= 90, f"stock WebView major {major} is below 90"
          receipt = {
              "classification": "stock-system-image-provider",
              "package": package,
              "version": version,
              "major": major,
              "minimumMajor": 90,
              "latestSecurityBrowserProof": False,
          }
          evidence = Path(os.environ["PROVIDER_DUMP"]).with_name("stock-webview-provider.json")
          evidence.write_text(json.dumps(receipt, indent=2) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"CURRENT_WEBVIEW_PACKAGE={package}\n")
              env.write(f"CURRENT_WEBVIEW_VERSION={version}\n")
          PY
          # GITHUB_ENV values become available to later steps, so parse the same
          # observed values locally for this step's package and payload receipts.
          current_package="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"])' "$run_evidence/stock-webview-provider.json")"
          current_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$run_evidence/stock-webview-provider.json")"
          adb -s "$EMULATOR_SERIAL" shell dumpsys package "$current_package" \
            > "$run_evidence/stock-webview-package.txt"
          grep -F "versionName=$current_version" "$run_evidence/stock-webview-package.txt"
          adb -s "$EMULATOR_SERIAL" shell pm path "$current_package" \
            | tr -d '\r' | sed -n 's/^package://p' \
            > "$run_evidence/stock-webview-paths.txt"
          test -s "$run_evidence/stock-webview-paths.txt"
          : > "$run_evidence/stock-webview-apk-sha256.txt"
          while IFS= read -r provider_path; do
            test -n "$provider_path"
            adb -s "$EMULATOR_SERIAL" shell sha256sum "$provider_path" \
              >> "$run_evidence/stock-webview-apk-sha256.txt"
          done < "$run_evidence/stock-webview-paths.txt"
          grep -Eq '^[0-9a-f]{64}  /' "$run_evidence/stock-webview-apk-sha256.txt"

          timeout 120s adb -s "$EMULATOR_SERIAL" install --no-streaming -r "$HARNESS_APP_APK" \
            | tee "$run_evidence/instrumentation-app-install.txt"
          grep -Eq '^Success\r?$' "$run_evidence/instrumentation-app-install.txt"
          timeout 120s adb -s "$EMULATOR_SERIAL" install --no-streaming -r -t "$HARNESS_TEST_APK" \
            | tee "$run_evidence/instrumentation-test-install.txt"
          grep -Eq '^Success\r?$' "$run_evidence/instrumentation-test-install.txt"

          python3 scripts/android_phone_runtime_check.py \
            --adb adb \
            --serial "$EMULATOR_SERIAL" \
            --apk "$CANDIDATE_APK" \
            --evidence "$run_evidence" \
            --expected-sha256 "$CANDIDATE_APK_SHA256" \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-version-code "$CANDIDATE_VERSION_CODE" \
            --expected-published-version "$PUBLISHED_ANDROID_VERSION" \
            --minimum-webview-major 90 \
            --expected-webview-package "$current_package" \
            --expected-webview-version "$current_version" \
            --boot-timeout 60 \
            --ui-timeout 60 \
            --update-timeout 120

          trap - EXIT
          stop_owned_emulator

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-current-api36-runtime-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

  permission-return-fixtures:
    if: github.ref_type == 'branch' && inputs.permission_fixture == true && inputs.external_player_fixture != true && inputs.touch_player_fixture != true
    uses: ./.github/workflows/android-permission-return-fixture.yml
    permissions:
      contents: read

  external-player-fixture:
    if: github.ref_type == 'branch' && inputs.external_player_fixture == true && inputs.permission_fixture != true && inputs.touch_player_fixture != true
    name: Exact public phone59 external player on fresh API36
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE: android-external-player-evidence
      PRODUCT_APK: public-phone59.apk
      PRODUCT_SHA256: 5fe550e66658f3c9ae172c087c656d69e126af2892df05ca15e7e021594dae47
      PRODUCT_SIZE: "88644481"
      PRODUCT_SOURCE: ac885bb98b2672614beb801b5aea11eb2f98ab40
      HOSTED_UI_SOURCE: ac885bb98b2672614beb801b5aea11eb2f98ab40
      SERVER_RUNTIME_SOURCE: ac885bb98b2672614beb801b5aea11eb2f98ab40
      PRODUCT_VERSION: 2.3.59
      PRODUCT_VERSION_CODE: "2003059"
      PRODUCT_SIGNER_SHA256: 233ff9e26de50c5a560417e2c33956845422ea262168bffffadf4758301fc72a
      PRODUCT_RELEASE_TAG: android-v2.3.59
      VLC_APK: VLC-Android-3.7.1-x86_64.apk
      VLC_URL: https://download.videolan.org/pub/videolan/vlc-android/3.7.1/VLC-Android-3.7.1-x86_64.apk
      VLC_CHECKSUM_URL: https://download.videolan.org/pub/videolan/vlc-android/3.7.1/VLC-Android-3.7.1-x86_64.apk.sha256
      VLC_SHA256: 4646633ede40c4784c5584087cffc5c60cc45b16966ae0b36cedd784d7c4a11e
      VLC_SIZE: "49444910"
      VLC_SIGNER_SHA256: c8768d2cea0c4b622e419b4b4715981946821e4ebc035fb41776cad395a7f68e
      VLC_PACKAGE: org.videolan.vlc
      VLC_VERSION: 3.7.1
      VLC_VERSION_CODE: "13070108"
      VLC_INTENT_ACTIVITY: org.videolan.vlc.StartActivity
      VLC_PLAYBACK_ACTIVITY: org.videolan.vlc.gui.video.VideoPlayerActivity
      SYSTEM_IMAGE_PACKAGE: system-images;android-36;google_apis;x86_64
      EMULATOR_SERIAL: emulator-5554
      AVD_NAME: yawf-external-phone59-api36
    steps:
      - name: Checkout runtime fixture and driver
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable public APK verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE }}
          path: public-phone-source
          persist-credentials: false
      - name: Bind exact public APK and source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$EVIDENCE"
          driver_source="$(git rev-parse HEAD)"
          test "$(git -C public-phone-source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$HOSTED_UI_SOURCE" = "$PRODUCT_SOURCE"
          test "$SERVER_RUNTIME_SOURCE" = "$PRODUCT_SOURCE"
          test -z "$(git -C public-phone-source status --porcelain --untracked-files=no)"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
            "https://github.com/Tgk-30/YAWF-Stream/releases/download/$PRODUCT_RELEASE_TAG/YAWF.Stream_Android_$PRODUCT_VERSION.apk" \
            --output "$PRODUCT_APK"
          printf '%s  %s\n' "$PRODUCT_SHA256" "$PRODUCT_APK" | sha256sum --check -
          test "$(wc -c < "$PRODUCT_APK" | tr -d ' ')" = "$PRODUCT_SIZE"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
            "$VLC_URL" --output "$VLC_APK"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 30 \
            "$VLC_CHECKSUM_URL" --output "$VLC_APK.sha256"
          test "$(cat "$VLC_APK.sha256")" = "$VLC_SHA256 *$VLC_APK"
          printf '%s  %s\n' "$VLC_SHA256" "$VLC_APK" | sha256sum --check -
          test "$(wc -c < "$VLC_APK" | tr -d ' ')" = "$VLC_SIZE"
          {
            echo "driverSource=$driver_source"
            echo "fixtureHarnessSource=$driver_source"
            echo "fixtureHarnessRole=test-only-separate-from-app"
            echo "publicApkSource=$PRODUCT_SOURCE"
            echo "publicApkSha256=$PRODUCT_SHA256"
            echo "publicApkVersion=$PRODUCT_VERSION"
            echo "publicApkVersionCode=$PRODUCT_VERSION_CODE"
            echo "publicApkSignerSha256=$PRODUCT_SIGNER_SHA256"
            echo "publicReleaseTag=$PRODUCT_RELEASE_TAG"
            echo "hostedUiSource=$HOSTED_UI_SOURCE"
            echo "serverRuntimeSource=$SERVER_RUNTIME_SOURCE"
            echo "interoperability=exact-public-phone59-with-exact-ac885-hosted-ui-and-server-runtime"
            echo "productionServerOrProviderProof=false"
            echo "publicOtaProof=false"
            echo "arm16KiBProof=false"
            echo "physicalDeviceProof=false"
            echo "realAccountOrCredentialUsed=false"
            echo "vlcOfficialUrl=$VLC_URL"
            echo "vlcOfficialChecksumUrl=$VLC_CHECKSUM_URL"
            echo "vlcSha256=$VLC_SHA256"
            echo "vlcInstalledOnlyAsIsolatedExternalHandler=true"
          } > "$EVIDENCE/binding.txt"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify external driver and diagnostic redaction contracts
        shell: bash
        run: node --test scripts/android_external_player_workflow.test.mjs scripts/android_external_logcat_redaction.test.mjs
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up isolated driver Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Install exact official image and media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 ffmpeg fonts-dejavu-core
          timeout 180s sdkmanager --list --channel=0 > "$EVIDENCE/sdk-metadata.txt"
          grep -E '^ *system-images;android-36;google_apis;x86_64 *\|' "$EVIDENCE/sdk-metadata.txt"
          sdkmanager platform-tools emulator 'platforms;android-36' 'build-tools;36.0.0' "$SYSTEM_IMAGE_PACKAGE"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$sdk/emulator/emulator"
          image="$sdk/system-images/android-36/google_apis/x86_64"
          test -f "$image/package.xml"
          test -f "$image/source.properties"
          sha256sum "$image/package.xml" "$image/source.properties" > "$EVIDENCE/image-metadata-sha256.txt"
          {
            echo "$sdk/build-tools/36.0.0"
            echo "$sdk/emulator"
            echo "$sdk/platform-tools"
          } >> "$GITHUB_PATH"
      - name: Verify unchanged production-signed APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(apkanalyzer manifest application-id "$PRODUCT_APK")" = com.tgk30.debridstreamer
          test "$(apkanalyzer manifest version-name "$PRODUCT_APK")" = "$PRODUCT_VERSION"
          test "$(apkanalyzer manifest version-code "$PRODUCT_APK")" = "$PRODUCT_VERSION_CODE"
          source_pin="$(tr -d '[:space:]' < public-phone-source/web/src-tauri/SIGNING_CERT_SHA256)"
          test "$source_pin" = "$PRODUCT_SIGNER_SHA256"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk/build-tools/36.0.0/apksigner" verify --print-certs "$PRODUCT_APK" \
            > "$EVIDENCE/product-signer.txt" 2>&1
          actual_signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE/product-signer.txt")"
          test "$actual_signer" = "$PRODUCT_SIGNER_SHA256"
          python3 public-phone-source/scripts/verify_android_apk.py \
            --apk "$PRODUCT_APK" --version "$PRODUCT_VERSION" \
            --certificate-pin public-phone-source/web/src-tauri/SIGNING_CERT_SHA256 \
            --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" | tee "$EVIDENCE/apk-verification.txt"
      - name: Verify exact official VLC external-handler APK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test "$(apkanalyzer manifest application-id "$VLC_APK")" = "$VLC_PACKAGE"
          test "$(apkanalyzer manifest version-name "$VLC_APK")" = "$VLC_VERSION"
          test "$(apkanalyzer manifest version-code "$VLC_APK")" = "$VLC_VERSION_CODE"
          aapt2 dump badging "$VLC_APK" > "$EVIDENCE/vlc-badging.txt"
          grep -Fxq "minSdkVersion:'17'" "$EVIDENCE/vlc-badging.txt"
          grep -Fq "targetSdkVersion:'36'" "$EVIDENCE/vlc-badging.txt"
          grep -Fq "native-code: 'x86_64'" "$EVIDENCE/vlc-badging.txt"
          test "$(sed -n "s/^application-label:'\([^']*\)'$/\1/p" "$EVIDENCE/vlc-badging.txt" | head -1)" = VLC
          "$sdk/build-tools/36.0.0/apksigner" verify --print-certs "$VLC_APK" \
            > "$EVIDENCE/vlc-signer.txt" 2>&1
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE/vlc-signer.txt")"
          test "$signer" = "$VLC_SIGNER_SHA256"
          apkanalyzer manifest print "$VLC_APK" > "$EVIDENCE/vlc-manifest.xml"
          python3 - <<'PYVLC'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          android='{http://schemas.android.com/apk/res/android}'
          root=ET.parse(Path(os.environ['EVIDENCE'])/'vlc-manifest.xml').getroot()
          activities={a.get(android+'name'):a for a in root.findall('.//activity')}
          start=activities[os.environ['VLC_INTENT_ACTIVITY']]
          assert start.get(android+'exported')=='true'
          eligible=False
          for intent in start.findall('intent-filter'):
              actions={x.get(android+'name') for x in intent.findall('action')}
              categories={x.get(android+'name') for x in intent.findall('category')}
              schemes={x.get(android+'scheme') for x in intent.findall('data') if x.get(android+'scheme')}
              types={x.get(android+'mimeType') for x in intent.findall('data') if x.get(android+'mimeType')}
              if ('android.intent.action.VIEW' in actions and
                  {'android.intent.category.DEFAULT','android.intent.category.BROWSABLE'} <= categories and
                  'http' in schemes and 'https' in schemes and 'video/*' in types):
                  eligible=True
          assert eligible, 'Pinned VLC StartActivity lost HTTP/HTTPS video intent support'
          playback=activities[os.environ['VLC_PLAYBACK_ACTIVITY']]
          assert playback.get(android+'exported')=='true'
          PYVLC
          printf 'sha256=%s\nsize=%s\nsignerSha256=%s\npackage=%s\nversion=%s\nversionCode=%s\nintentActivity=%s\nplaybackActivity=%s\nruntimePass=false\n' \
            "$VLC_SHA256" "$VLC_SIZE" "$VLC_SIGNER_SHA256" "$VLC_PACKAGE" "$VLC_VERSION" \
            "$VLC_VERSION_CODE" "$VLC_INTENT_ACTIVITY" "$VLC_PLAYBACK_ACTIVITY" \
            > "$EVIDENCE/vlc-admission.txt"
      - name: Build exact released web UI and isolated driver
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C public-phone-source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          (cd public-phone-source/web && npm ci && npm run build)
          (cd public-phone-source/server && npm ci)
          test "$(git -C public-phone-source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test -z "$(git -C public-phone-source status --porcelain --untracked-files=no)"
          python3 - <<'PYSOURCE'
          import hashlib,json,os,stat,subprocess
          from pathlib import Path
          root=Path('public-phone-source').resolve()
          evidence=Path(os.environ['EVIDENCE'])
          def sha256(path):
              digest=hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda:source.read(1024*1024),b''):
                      digest.update(chunk)
              return digest.hexdigest()
          def inventory(relative,max_files,max_bytes):
              base=root/relative
              files=[]; total=0
              for path in sorted(base.rglob('*')):
                  mode=path.lstat().st_mode
                  assert not stat.S_ISLNK(mode), 'Exact source inventory refuses symlinks'
                  if path.is_dir(): continue
                  assert path.is_file(), 'Exact source inventory accepts only regular files'
                  size=path.stat().st_size
                  total+=size
                  assert len(files)<max_files and total<=max_bytes, 'Exact source inventory exceeded its fixed bound'
                  files.append({'path':path.relative_to(base).as_posix(),'bytes':size,'sha256':sha256(path)})
              assert files, 'Exact source inventory is empty'
              return {'files':files,'fileCount':len(files),'totalBytes':total}
          web=inventory(Path('web/dist'),512,64*1024*1024)
          server=inventory(Path('server/src'),2048,32*1024*1024)
          index=next(item for item in web['files'] if item['path']=='index.html')
          fixture=Path('scripts/android_external_player_server_fixture.mts').resolve()
          driver_source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          release_source=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          assert release_source==os.environ['PRODUCT_SOURCE']==os.environ['HOSTED_UI_SOURCE']==os.environ['SERVER_RUNTIME_SOURCE']
          receipt={
              'schemaVersion':1,
              'nativeApp':{
                  'sourceRevision':release_source,
                  'version':os.environ['PRODUCT_VERSION'],
                  'versionCode':os.environ['PRODUCT_VERSION_CODE'],
                  'apkSha256':os.environ['PRODUCT_SHA256'],
                  'apkBytes':int(os.environ['PRODUCT_SIZE']),
                  'signerSha256':os.environ['PRODUCT_SIGNER_SHA256'],
                  'releaseTag':os.environ['PRODUCT_RELEASE_TAG'],
              },
              'hostedUi':{
                  'sourceRevision':release_source,
                  'webDist':{'indexSha256':index['sha256'],**web},
              },
              'serverRuntime':{
                  'sourceRevision':release_source,
                  'packageJsonSha256':sha256(root/'server/package.json'),
                  'packageLockSha256':sha256(root/'server/package-lock.json'),
                  'source':server,
              },
              'fixtureHarness':{
                  'sourceRevision':driver_source,
                  'path':'scripts/android_external_player_server_fixture.mts',
                  'sha256':sha256(fixture),
                  'role':'test-only-separate-from-app',
              },
              'boundaries':{
                  'productionServerOrProviderProof':False,
                  'physicalDeviceProof':False,
                  'decodedPlaybackProofRequiresRuntimeReview':True,
              },
          }
          target=evidence/'source-runtime-admission.json'
          with target.open('x',encoding='utf-8') as output:
              json.dump(receipt,output,indent=2,sort_keys=True)
              output.write('\n')
          target.chmod(0o600)
          PYSOURCE
          gradle --project-dir scripts/android-runtime-instrumentation --no-daemon --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          app=scripts/android-runtime-instrumentation/app/build/outputs/apk/debug/app-debug.apk
          tests=scripts/android-runtime-instrumentation/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum "$app" "$tests" > "$EVIDENCE/driver-apk-sha256.txt"
          apkanalyzer manifest print "$app" > "$EVIDENCE/driver-app-manifest.xml"
          apkanalyzer manifest print "$tests" > "$EVIDENCE/driver-test-manifest.xml"
          if grep -Eqi 'INTERNET|BIND_ACCESSIBILITY_SERVICE|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES' \
            "$EVIDENCE/driver-app-manifest.xml" "$EVIDENCE/driver-test-manifest.xml"; then
            echo 'Forbidden driver permission' >&2
            exit 1
          fi
          echo "HARNESS_APP_APK=$app" >> "$GITHUB_ENV"
          echo "HARNESS_TEST_APK=$tests" >> "$GITHUB_ENV"
      - name: Run normal remote UI and external handoff on one fresh emulator
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          if adb devices | awk 'NR > 1 && NF > 0 { found = 1 } END { exit !found }'; then
            echo 'Refusing to reuse an existing emulator/device' >&2
            exit 1
          fi
          export ANDROID_USER_HOME="$RUNNER_TEMP/yawf-external-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          test ! -e "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$EVIDENCE/ui"
          fixture_output="$RUNNER_TEMP/yawf-external-fixture"
          emulator_pid=""
          fixture_pid=""
          activity_monitor_pid=""
          activity_monitor_stop="$RUNNER_TEMP/yawf-vlc-activity-monitor.stop"
          test ! -e "$activity_monitor_stop"
          export ACTIVITY_MONITOR_STOP="$activity_monitor_stop"
          collect_bounded_player_logcat() {
            if [ -f "$EVIDENCE/player-logcat.txt" ]; then return 0; fi
            set +e
            timeout 20s adb -s "$EMULATOR_SERIAL" logcat -d -v threadtime -t 12000 2>/dev/null \
              | python3 -c '
          import re,sys
          url=re.compile(r"(?i)https?://[^\s\"\x27<>]+")
          capability=re.compile(r"(?i)/api/external-stream/[A-Za-z0-9_-]{1,120}/[A-Za-z0-9_-]{32,128}(?:/[A-Za-z0-9_.-]{1,160})?")
          sensitive=re.compile(r"(?i)\b(?:authorization|proxy-authorization|cookie|set-cookie|bearer|ds_session|ds_csrf)\b")
          total=0
          for index,line in enumerate(sys.stdin):
              if index>=12000: break
              line=capability.sub("[redacted-capability]",line)
              line=url.sub("[redacted-url]",line)
              secret=sensitive.search(line)
              if secret is not None:
                  line=line[:secret.start()]+"[redacted-sensitive]\n"
              encoded=line.encode("utf-8","replace")
              if total+len(encoded)>8*1024*1024: break
              sys.stdout.buffer.write(encoded)
              total+=len(encoded)
          ' > "$EVIDENCE/player-logcat.txt.part"
            pipeline_status=("${PIPESTATUS[@]}")
            logcat_status=${pipeline_status[0]}
            sanitizer_status=${pipeline_status[1]}
            if [ "$sanitizer_status" -eq 0 ] && [ -s "$EVIDENCE/player-logcat.txt.part" ]; then
              mv "$EVIDENCE/player-logcat.txt.part" "$EVIDENCE/player-logcat.txt"
            else
              rm -f "$EVIDENCE/player-logcat.txt.part"
            fi
            printf 'adbStatus=%s\nsanitizerStatus=%s\nmaxLines=12000\nmaxBytes=8388608\nrawPersisted=false\n' \
              "$logcat_status" "$sanitizer_status" > "$EVIDENCE/player-logcat-receipt.txt"
          }
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            if [ -n "$activity_monitor_pid" ]; then
              : > "$activity_monitor_stop"
              wait "$activity_monitor_pid" 2>/dev/null
            fi
            if [ -n "$emulator_pid" ]; then
              collect_bounded_player_logcat
              if [ "$status" != 0 ] && [ "$(timeout 5s adb -s "$EMULATOR_SERIAL" emu avd name 2>/dev/null | tr -d '\r' | head -1)" = "$AVD_NAME" ]; then
                timeout 15s adb -s "$EMULATOR_SERIAL" exec-out screencap -p > "$EVIDENCE/workflow-failure.png"
                timeout 20s adb -s "$EMULATOR_SERIAL" shell uiautomator dump /data/local/tmp/yawf-external-failure.xml > "$EVIDENCE/workflow-failure-dump.txt" 2>&1
                timeout 10s adb -s "$EMULATOR_SERIAL" exec-out cat /data/local/tmp/yawf-external-failure.xml \
                  | sed -E 's#https?://[^[:space:]"<>]+#[redacted-url]#g' > "$EVIDENCE/workflow-failure.xml"
              fi
              timeout 10s adb -s "$EMULATOR_SERIAL" reverse --remove tcp:43120 >/dev/null 2>&1
              timeout 10s adb -s "$EMULATOR_SERIAL" emu kill >/dev/null 2>&1
              kill "$emulator_pid" 2>/dev/null
              wait "$emulator_pid" 2>/dev/null
            fi
            if [ -n "$fixture_pid" ]; then
              kill "$fixture_pid" 2>/dev/null
              wait "$fixture_pid" 2>/dev/null
            fi
            for name in smoke-result.json external-capability-runtime.json media-probe.json; do
              if [ -f "$fixture_output/$name" ]; then
                cp "$fixture_output/$name" "$EVIDENCE/$name"
              fi
            done
            printf 'workflowExit=%s\nownedEmulatorStopAttempted=true\nownedFixtureStopAttempted=true\n' "$status" > "$EVIDENCE/cleanup.txt"
            exit "$status"
          }
          trap cleanup EXIT
          ffmpeg -hide_banner -filters > "$EVIDENCE/ffmpeg-filters.txt" 2>&1
          grep -E '\bdrawtext\b' "$EVIDENCE/ffmpeg-filters.txt"
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          node public-phone-source/server/node_modules/tsx/dist/cli.mjs scripts/android_external_player_server_fixture.mts \
            --repo "$GITHUB_WORKSPACE/public-phone-source" --output "$fixture_output" > "$EVIDENCE/fixture.log" 2>&1 &
          fixture_pid=$!
          deadline=$((SECONDS + 180))
          until grep -Fq '[fixture] READY server-mode-ui loopback' "$EVIDENCE/fixture.log"; do
            kill -0 "$fixture_pid"
            test "$SECONDS" -lt "$deadline"
            sleep 1
          done
          printf 'no\n' | avdmanager create avd --name "$AVD_NAME" --package "$SYSTEM_IMAGE_PACKAGE" --device pixel_2
          emulator -avd "$AVD_NAME" -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect -feature -Vulkan -cores 2 -memory 2048 \
            > "$EVIDENCE/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 300))
          until [ "$(timeout 5s adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator_pid"
            test "$SECONDS" -lt "$deadline"
            sleep 2
          done
          test "$(adb -s "$EMULATOR_SERIAL" emu avd name | tr -d '\r' | head -1)" = "$AVD_NAME"
          test "$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" = 36
          test "$(adb -s "$EMULATOR_SERIAL" shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          test "$(adb -s "$EMULATOR_SERIAL" shell getconf PAGE_SIZE | tr -d '\r')" = 4096
          adb -s "$EMULATOR_SERIAL" shell dumpsys account | python3 -c \
            'import sys,re; s=sys.stdin.read(); counts=re.findall(r"Accounts: (\d+)",s); assert counts and all(int(x)==0 for x in counts); print("androidAccountCount=0")' \
            > "$EVIDENCE/no-real-accounts.txt"
          adb -s "$EMULATOR_SERIAL" shell dumpsys webviewupdate > "$EVIDENCE/stock-webview.txt"
          python3 - <<'PYENGINE'
          # BEGIN EXTERNAL_STOCK_WEBVIEW_POLICY
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from android_phone_runtime_check import parse_webview_provider,validate_webview_provider
          evidence=Path(os.environ['EVIDENCE'])
          provider=parse_webview_provider((evidence/'stock-webview.txt').read_text())
          major=validate_webview_provider(provider,minimum_major=90,expected_package='com.google.android.webview',expected_version=None)
          (evidence/'stock-webview-admission.json').write_text(json.dumps({'package':provider.package_name,'version':provider.version_name,'major':major,'minimumMajor':90,'stockImageProvider':True,'currentSecurityBrowserProof':False},indent=2)+'\n')
          # END EXTERNAL_STOCK_WEBVIEW_POLICY
          PYENGINE
          provider_apk="$(adb -s "$EMULATOR_SERIAL" shell pm path com.google.android.webview | tr -d '\r' | sed -n 's/^package://p' | head -1)"
          test -n "$provider_apk"
          adb -s "$EMULATOR_SERIAL" shell sha256sum "$provider_apk" > "$EVIDENCE/stock-webview-apk-sha256.txt"
          adb -s "$EMULATOR_SERIAL" reverse tcp:43120 tcp:43120
          adb -s "$EMULATOR_SERIAL" install "$PRODUCT_APK" | tee "$EVIDENCE/product-install.txt"
          grep -Eq '^Success\r?$' "$EVIDENCE/product-install.txt"
          installed="$(adb -s "$EMULATOR_SERIAL" shell pm path com.tgk30.debridstreamer | tr -d '\r' | sed -n 's/^package://p')"
          test -n "$installed"
          test "$(printf '%s\n' "$installed" | wc -l | tr -d ' ')" = 1
          installed_sha="$(adb -s "$EMULATOR_SERIAL" shell sha256sum "$installed" | awk '{print $1}')"
          test "$installed_sha" = "$PRODUCT_SHA256"
          printf '%s\n' "$installed_sha" > "$EVIDENCE/installed-product-sha256.txt"
          adb -s "$EMULATOR_SERIAL" install "$HARNESS_APP_APK"
          adb -s "$EMULATOR_SERIAL" install "$HARNESS_TEST_APK"

          # Preserve the fresh-image Photos failure as stock evidence before adding the exact admitted VLC fixture handler.
          adb -s "$EMULATOR_SERIAL" shell cmd package query-activities --brief \
            -a android.intent.action.VIEW -d http://127.0.0.1:43120/synthetic.mp4 -t 'video/*' \
            > "$EVIDENCE/stock-video-handlers.txt"
          adb -s "$EMULATOR_SERIAL" install "$VLC_APK" | tee "$EVIDENCE/vlc-install.txt"
          grep -Eq '^Success\r?$' "$EVIDENCE/vlc-install.txt"
          vlc_installed="$(adb -s "$EMULATOR_SERIAL" shell pm path "$VLC_PACKAGE" | tr -d '\r' | sed -n 's/^package://p')"
          test -n "$vlc_installed"
          test "$(printf '%s\n' "$vlc_installed" | wc -l | tr -d ' ')" = 1
          vlc_installed_sha="$(adb -s "$EMULATOR_SERIAL" shell sha256sum "$vlc_installed" | awk '{print $1}')"
          test "$vlc_installed_sha" = "$VLC_SHA256"
          printf '%s\n' "$vlc_installed_sha" > "$EVIDENCE/installed-vlc-sha256.txt"
          adb -s "$EMULATOR_SERIAL" shell cmd package query-activities --brief \
            -a android.intent.action.VIEW -d http://127.0.0.1:43120/synthetic.mp4 -t 'video/*' \
            > "$EVIDENCE/video-handlers-with-vlc.txt"
          python3 - <<'PYHANDLERS'
          # BEGIN EXTERNAL_VLC_HANDLER_POLICY
          import json,os,re
          from pathlib import Path
          evidence=Path(os.environ['EVIDENCE'])
          java_identifier=r'[A-Za-z_$][A-Za-z0-9_$]*'
          package_pattern=java_identifier+r'(?:\.'+java_identifier+r')+'
          relative_activity=r'\.'+java_identifier+r'(?:\.'+java_identifier+r')*'
          activity_pattern=r'(?:'+relative_activity+r'|'+package_pattern+r')'
          component_pattern=re.compile(r'^('+package_pattern+r')/('+activity_pattern+r')$')
          detail_pattern=re.compile(r'^priority=-?[0-9]+ preferredOrder=-?[0-9]+ match=0x[0-9a-fA-F]+ specificIndex=-?[0-9]+ isDefault=(?:true|false)$')
          def parse(name):
              lines=[line.strip() for line in (evidence/name).read_text().splitlines() if line.strip()]
              assert lines and lines!=['No activities found'], 'Missing activity summary'
              summary=re.fullmatch(r'([0-9]{1,3}) activities found:',lines[0])
              assert summary, 'Malformed or duplicate activity summary'
              reported=int(summary.group(1)); cursor=1; components=[]
              for expected_index in range(reported):
                  assert cursor<len(lines), 'Truncated activity record'
                  record=re.fullmatch(r'Activity #([0-9]{1,3}):',lines[cursor])
                  assert record and int(record.group(1))==expected_index, 'Missing, duplicate, or reordered Activity record'
                  cursor+=1
                  assert cursor<len(lines) and detail_pattern.fullmatch(lines[cursor]), 'Missing or unrecognized Activity details'
                  cursor+=1
                  assert cursor<len(lines), 'Missing Activity component'
                  component=component_pattern.fullmatch(lines[cursor])
                  assert component, 'Malformed or unrecognized Activity component'
                  package,activity=component.groups()
                  canonical=package+activity if activity.startswith('.') else activity
                  components.append({'package':package,'activity':canonical,'compact':lines[cursor]})
                  cursor+=1
              assert cursor==len(lines), 'Unexpected trailing, duplicate, or uncounted Activity data'
              assert len(components)==reported, 'Reported activity count mismatch'
              assert len({x['compact'] for x in components})==len(components), 'Duplicate Activity component'
              assert len({(x['package'],x['activity']) for x in components})==len(components), 'Duplicate canonical Activity component'
              return components
          photos=('com.google.android.apps.photos','com.google.android.apps.photos.pager.HostPhotoPagerActivity')
          vlc=(os.environ['VLC_PACKAGE'],os.environ['VLC_INTENT_ACTIVITY'])
          stock=parse('stock-video-handlers.txt')
          admitted=parse('video-handlers-with-vlc.txt')
          assert {(x['package'],x['activity']) for x in stock}=={photos}, 'Fresh image no longer has the exact recorded sole Photos handler'
          assert {(x['package'],x['activity']) for x in admitted}=={photos,vlc}, 'Installed handler set differs from exact Photos plus admitted VLC'
          target=[x for x in admitted if (x['package'],x['activity'])==vlc]
          assert len(target)==1, 'Exact VLC handler is missing or duplicated'
          receipt={
              'activityCount':len(admitted),
              'activities':admitted,
              'stockActivities':stock,
              'stockPhotosFailurePreserved':True,
              'realChooserRequired':True,
              'targetLabel':'VLC',
              'targetPackage':vlc[0],
              'targetActivity':vlc[1],
              'manifestDeclaredPlaybackActivity':os.environ['VLC_PLAYBACK_ACTIVITY'],
          }
          (evidence/'vlc-handler-query-admission.json').write_text(json.dumps(receipt,indent=2)+'\n')
          # END EXTERNAL_VLC_HANDLER_POLICY
          PYHANDLERS
          handler_label=VLC
          handler_package="$VLC_PACKAGE"
          handler_activity="$VLC_INTENT_ACTIVITY"
          handler_playback_activity="$VLC_PLAYBACK_ACTIVITY"
          handler_activity_count="$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["EVIDENCE"])/"vlc-handler-query-admission.json").read_text())["activityCount"])')"
          test "$handler_activity_count" = 2
          handler_args=()
          if [ -n "$handler_package" ]; then
            handler_args=(
              -e externalHandlerLabel "$handler_label"
              -e externalHandlerPackage "$handler_package"
              -e externalHandlerActivity "$handler_activity"
              -e externalHandlerPlaybackActivity "$handler_playback_activity"
              -e externalHandlerActivityCount "$handler_activity_count"
            )
          fi
          adb -s "$EMULATOR_SERIAL" logcat -c
          python3 - <<'PYACTIVITY' &
          import json,os,re,subprocess,time
          from pathlib import Path
          evidence=Path(os.environ['EVIDENCE'])
          stop=Path(os.environ['ACTIVITY_MONITOR_STOP'])
          package=os.environ['VLC_PACKAGE']
          intent=os.environ['VLC_INTENT_ACTIVITY']
          playback=os.environ['VLC_PLAYBACK_ACTIVITY']
          component=re.compile(r'\b('+re.escape(package)+r')/(\.[A-Za-z_$][A-Za-z0-9_$.]*|[A-Za-z_$][A-Za-z0-9_$.]*)\b')
          observed_package=False
          observed_intent=False
          observed_playback=False
          samples=0
          deadline=time.monotonic()+490
          while not stop.exists() and time.monotonic()<deadline:
              samples+=1
              try:
                  result=subprocess.run(
                      ['adb','-s',os.environ['EMULATOR_SERIAL'],'shell','dumpsys','activity','activities'],
                      text=True,capture_output=True,timeout=5,check=False)
              except subprocess.TimeoutExpired:
                  result=None
              if result is not None and result.returncode==0:
                  for line in result.stdout.splitlines():
                      if 'mResumedActivity' not in line and 'topResumedActivity' not in line:
                          continue
                      match=component.search(line)
                      if not match:
                          continue
                      observed_package=True
                      activity=package+match.group(2) if match.group(2).startswith('.') else match.group(2)
                      observed_intent=observed_intent or activity==intent
                      observed_playback=observed_playback or activity==playback
              receipt={
                  'schemaVersion':1,
                  'samples':samples,
                  'targetPackageObserved':observed_package,
                  'targetIntentActivityObserved':observed_intent,
                  'manifestPlaybackActivityObserved':observed_playback,
                  'rawActivityDumpPersisted':False,
              }
              temporary=evidence/'vlc-activity-observation.json.tmp'
              temporary.write_text(json.dumps(receipt,indent=2)+'\n')
              temporary.replace(evidence/'vlc-activity-observation.json')
              time.sleep(0.25)
          PYACTIVITY
          activity_monitor_pid=$!
          set +e
          timeout 480s adb -s "$EMULATOR_SERIAL" shell am instrument -w -r \
            -e class com.yawf.runtimeinstrumentation.RuntimeExternalPlayerFlowTest \
            -e evidenceSubdir persistent-external-player-flow "${handler_args[@]}" \
            com.yawf.runtimeinstrumentation.test/androidx.test.runner.AndroidJUnitRunner \
            | sed -E 's#https?://[^[:space:]"<>]+#[redacted-url]#g' | tee "$EVIDENCE/instrumentation.txt"
          instrumentation_status=${PIPESTATUS[0]}
          set -e
          : > "$activity_monitor_stop"
          wait "$activity_monitor_pid"
          activity_monitor_pid=""
          export INSTRUMENTATION_STATUS="$instrumentation_status"
          cp "$fixture_output/smoke-result.json" "$EVIDENCE/smoke-result.json"
          cp "$fixture_output/external-capability-runtime.json" "$EVIDENCE/external-capability-runtime.json"
          cp "$fixture_output/media-probe.json" "$EVIDENCE/media-probe.json"
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          a=['adb','-s',os.environ['EMULATOR_SERIAL']]
          base=['exec-out','run-as','com.yawf.runtimeinstrumentation']
          folder='files/persistent-external-player-flow'
          names=subprocess.check_output(a+base+['ls','-1',folder],text=True).splitlines()
          assert 0<len(names)<=64
          allowed=re.compile(r'(?:[0-9]{2}-[a-z0-9-]+\.(?:png|xml)|actions\.txt|instrumentation-external-player-receipt\.json)')
          out=Path(os.environ['EVIDENCE'])/'ui'
          (out/'collector-observation.json').write_text(json.dumps({'filenames':names},indent=2)+'\n')
          unexpected=[]
          for n in names:
              if not allowed.fullmatch(n):
                  unexpected.append(n)
                  continue
              data=subprocess.check_output(a+base+['cat',folder+'/'+n])
              assert 0<len(data)<=8*1024*1024, 'Driver evidence size outside bound'
              (out/n).write_bytes(data)
          assert not unexpected, 'Unexpected driver evidence filename; known captures retained, see bounded collector observation'
          r=json.loads((out/'instrumentation-external-player-receipt.json').read_text())
          host=json.loads((Path(os.environ['EVIDENCE'])/'vlc-handler-query-admission.json').read_text())
          activity=json.loads((Path(os.environ['EVIDENCE'])/'vlc-activity-observation.json').read_text())
          live=json.loads((Path(os.environ['EVIDENCE'])/'external-capability-runtime.json').read_text())
          source=json.loads((Path(os.environ['EVIDENCE'])/'source-runtime-admission.json').read_text())
          smoke=json.loads((Path(os.environ['EVIDENCE'])/'smoke-result.json').read_text())
          assert source['nativeApp']['sourceRevision']==os.environ['PRODUCT_SOURCE']
          assert source['hostedUi']['sourceRevision']==os.environ['HOSTED_UI_SOURCE']
          assert source['serverRuntime']['sourceRevision']==os.environ['SERVER_RUNTIME_SOURCE']
          assert smoke['servedWebDist']==source['hostedUi']['webDist']['files']
          assert smoke['webIndexSha256']==source['hostedUi']['webDist']['indexSha256']
          checks=r['checks']
          assert r['outcome']=='passed' and checks['openPlayerClicks']==1
          # BEGIN EXTERNAL_DESTINATION_RECEIPT_POLICY
          destination=(checks['realAndroidChooserObserved'],checks['soleHandlerDirectLaunchObserved'])
          assert all(type(value) is bool for value in destination)
          assert destination == (True,False)
          # END EXTERNAL_DESTINATION_RECEIPT_POLICY
          assert host['stockPhotosFailurePreserved'] is True and host['realChooserRequired'] is True
          assert host['activityCount']==2
          assert r['externalHandlerActivityCount']==host['activityCount']
          assert r['expectedHandlerLabel']==host['targetLabel']=='VLC'
          assert r['expectedHandlerPackage']==host['targetPackage']==os.environ['VLC_PACKAGE']
          assert r['expectedHandlerActivity']==host['targetActivity']==os.environ['VLC_INTENT_ACTIVITY']
          assert r['manifestDeclaredPlaybackActivity']==host['manifestDeclaredPlaybackActivity']==os.environ['VLC_PLAYBACK_ACTIVITY']
          assert activity['targetPackageObserved'] is True
          assert activity['manifestPlaybackActivityObserved'] is True
          assert activity['rawActivityDumpPersisted'] is False
          assert checks['expectedHandlerForegroundObserved'] is True
          assert checks['vlcPlayerSurfaceObserved'] is True
          assert checks['permissionGrantUsed'] is False
          if checks['vlcOnboardingObserved']:
              assert checks['vlcStorageAccessDenied'] is True
          assert checks['manualMovingElapsedTimeCapturePair'] is True
          assert checks['semanticSeekGesturePerformed'] is True
          assert checks['singleBackReturnedToProduct'] is True
          live206=[event for event in live['events']
                   if event['phase']=='live' and (event.get('response') or {}).get('status')==206]
          assert live206, 'No completed live range response followed the real VLC handoff and seek'
          assert any(event['request']['range'].get('present') is True and
                     event['request']['range'].get('valid') is True and
                     event['response']['contentTypeClass']=='video-mp4' and
                     event['response']['acceptRangesClass']=='bytes' and
                     event['lifecycle']['finishObserved'] is True and
                     event['lifecycle']['prematureCloseObserved'] is False
                     for event in live206)
          assert r['decodedPlaybackClaimed'] is False and r['decodeClaimRequiresManualScreenshotAndLiveReceiptReview'] is True
          assert os.environ['INSTRUMENTATION_STATUS']=='0'
          print('Native UI flow passed; decoded playback remains pending root screenshot/live-response review')
          PY
          grep -Eq '^OK \(1 test\)\r?$' "$EVIDENCE/instrumentation.txt"
      - name: Retain bounded external-player runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-phone59-external-player-runtime-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

  touch-player-fixture:
    if: github.ref_type == 'branch' && inputs.touch_player_fixture == true && inputs.permission_fixture != true && inputs.external_player_fixture != true
    name: Signed phone59 candidate with exact phone59 touch UI on fresh API36
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE: android-touch-player-evidence
      PRODUCT_APK: verified-phone-candidate/YAWF.Stream_Android_2.3.59.apk
      PRODUCT_SHA256: 5fe550e66658f3c9ae172c087c656d69e126af2892df05ca15e7e021594dae47
      PRODUCT_SOURCE: ac885bb98b2672614beb801b5aea11eb2f98ab40
      PRODUCT_VERSION: 2.3.59
      PRODUCT_SIGNER_SHA256: 233ff9e26de50c5a560417e2c33956845422ea262168bffffadf4758301fc72a
      TOUCH_UI_SOURCE: ac885bb98b2672614beb801b5aea11eb2f98ab40
      TOUCH_UI_VERSION: 2.3.59
      SYSTEM_IMAGE_PACKAGE: system-images;android-36;google_apis;x86_64
      EMULATOR_SERIAL: emulator-5554
      AVD_NAME: yawf-touch-player-phone59-api36
      FIXTURE_APP_PORT: "43120"
      FIXTURE_MEDIA_PORT: "43121"
      npm_config_fetch_retries: "0"
    steps:
      - name: Checkout touch runtime harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout immutable signed59 native host verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SOURCE }}
          path: native-host-source
          persist-credentials: false

      - name: Checkout exact touch UI and server source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOUCH_UI_SOURCE }}
          path: touch-ui-source
          persist-credentials: false

      - name: Download exact signed59 candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12589729254
          run-id: 40169716770
          github-token: ${{ github.token }}
          path: verified-phone-candidate
          merge-multiple: true

      - name: Bind sources and verify immutable signed59 native host
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$EVIDENCE"
          test "$(git -C native-host-source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$(git -C touch-ui-source rev-parse HEAD)" = "$TOUCH_UI_SOURCE"
          test "$(node -p "require('./touch-ui-source/web/package.json').version")" = "$TOUCH_UI_VERSION"
          test -z "$(git -C native-host-source status --porcelain)"
          test -z "$(git -C touch-ui-source status --porcelain)"
          printf '%s  %s\n' "$PRODUCT_SHA256" "$PRODUCT_APK" | sha256sum --check -
          product_bytes="$(wc -c < "$PRODUCT_APK" | tr -d ' ')"
          test "$product_bytes" -gt 1000000
          test "$product_bytes" -lt 200000000
          {
            echo "harnessRevision=$(git rev-parse HEAD)"
            echo "nativeHostSource=$PRODUCT_SOURCE"
            echo "nativeHostSha256=$PRODUCT_SHA256"
            echo "nativeHostVersion=$PRODUCT_VERSION"
            echo "nativeProducerRunId=40169716770"
            echo "nativeArtifactId=12589729254"
            echo "touchUiSource=$TOUCH_UI_SOURCE"
            echo "touchUiVersion=$TOUCH_UI_VERSION"
            echo "twoSourceBoundary=immutable-native-host-plus-exact-hosted-web-ui"
            echo "acceptanceRuns=1-fresh-avd"
            echo "emulatorImage=$SYSTEM_IMAGE_PACKAGE"
            echo "productionServerOrProviderProof=false"
            echo "publicOtaProof=false"
            echo "standalone59Proof=false"
            echo "physicalDeviceProof=false"
            echo "realAccountOrCredentialUsed=false"
            echo "apkBytes=$product_bytes"
          } > "$EVIDENCE/binding.txt"

      - name: Set up Node 24 and JDK 17
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify harness contracts before tool or device mutation
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/android_touch_player_workflow.test.mjs scripts/android-touch-player-fixture/live-probe-contract.test.mjs
          node --check scripts/android-touch-player-fixture/media-contract.mjs
          node --check scripts/android_touch_player_server_fixture.mts

      - name: Set up Android SDK and isolated driver Gradle
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Install exact official image and required media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 ffmpeg
          timeout 180s sdkmanager --list --channel=0 > "$EVIDENCE/sdk-metadata.txt"
          grep -E '^ *system-images;android-36;google_apis;x86_64 *\|' "$EVIDENCE/sdk-metadata.txt"
          sdkmanager platform-tools emulator 'platforms;android-36' 'build-tools;36.0.0' "$SYSTEM_IMAGE_PACKAGE"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -x "$sdk/emulator/emulator"
          test -x "$sdk/build-tools/36.0.0/apksigner"
          test -x "$sdk/build-tools/36.0.0/aapt2"
          image="$sdk/system-images/android-36/google_apis/x86_64"
          test -f "$image/package.xml"
          test -f "$image/source.properties"
          sha256sum "$image/package.xml" "$image/source.properties" > "$EVIDENCE/image-metadata-sha256.txt"
          {
            echo "$sdk/build-tools/36.0.0"
            echo "$sdk/emulator"
            echo "$sdk/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Verify exact APK identity, actual version code, and signed59 signer
        shell: bash
        run: |
          set -euo pipefail
          test "$(apkanalyzer manifest application-id "$PRODUCT_APK")" = com.tgk30.debridstreamer
          actual_version="$(apkanalyzer manifest version-name "$PRODUCT_APK")"
          actual_version_code="$(apkanalyzer manifest version-code "$PRODUCT_APK")"
          test "$actual_version" = "$PRODUCT_VERSION"
          [[ "$actual_version_code" =~ ^[1-9][0-9]{0,9}$ ]]
          source_pin="$(tr '[:upper:]' '[:lower:]' < native-host-source/web/src-tauri/SIGNING_CERT_SHA256 | tr -d '[:space:]')"
          test "$source_pin" = "$PRODUCT_SIGNER_SHA256"
          apksigner verify --print-certs "$PRODUCT_APK" > "$EVIDENCE/apk-signer.txt" 2>&1
          actual_signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$EVIDENCE/apk-signer.txt")"
          test "$actual_signer" = "$PRODUCT_SIGNER_SHA256"
          python3 native-host-source/scripts/verify_android_apk.py \
            --apk "$PRODUCT_APK" --version "$PRODUCT_VERSION" \
            --certificate-pin native-host-source/web/src-tauri/SIGNING_CERT_SHA256 \
            --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" | tee "$EVIDENCE/apk-verification.txt"
          python3 - "$EVIDENCE/product-admission.json" "$actual_version" "$actual_version_code" "$actual_signer" <<'PY'
          import json,sys
          from pathlib import Path
          path,version,code,signer=sys.argv[1:]
          Path(path).write_text(json.dumps({
              "schemaVersion":1,
              "package":"com.tgk30.debridstreamer",
              "versionName":version,
              "versionCode":int(code),
              "versionCodeSource":"apkanalyzer-from-immutable-apk",
              "signerSha256":signer,
          },indent=2)+"\n")
          PY
          echo "PRODUCT_VERSION_CODE_ACTUAL=$actual_version_code" >> "$GITHUB_ENV"

      - name: Build exact hosted UI, real server, and isolated driver
        shell: bash
        run: |
          set -euo pipefail
          (cd touch-ui-source/web && npm ci && npm run build)
          (cd touch-ui-source/server && npm ci)
          test "$(git -C touch-ui-source rev-parse HEAD)" = "$TOUCH_UI_SOURCE"
          gradle --project-dir scripts/android-runtime-instrumentation --no-daemon --max-workers=2 \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          app=scripts/android-runtime-instrumentation/app/build/outputs/apk/debug/app-debug.apk
          tests=scripts/android-runtime-instrumentation/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$app"
          test -f "$tests"
          sha256sum "$app" "$tests" > "$EVIDENCE/driver-apk-sha256.txt"
          apkanalyzer manifest print "$app" > "$EVIDENCE/driver-app-manifest.xml"
          apkanalyzer manifest print "$tests" > "$EVIDENCE/driver-test-manifest.xml"
          if grep -Eqi 'INTERNET|BIND_ACCESSIBILITY_SERVICE|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES' \
            "$EVIDENCE/driver-app-manifest.xml" "$EVIDENCE/driver-test-manifest.xml"; then
            echo 'Forbidden isolated driver permission' >&2
            exit 1
          fi
          echo "HARNESS_APP_APK=$app" >> "$GITHUB_ENV"
          echo "HARNESS_TEST_APK=$tests" >> "$GITHUB_ENV"

      - name: Run one fresh native UI touch-player flow
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          test -r /dev/kvm -a -w /dev/kvm
          if adb devices | awk 'NR > 1 && NF > 0 { found = 1 } END { exit !found }'; then
            echo 'Refusing to reuse an existing emulator or device' >&2
            exit 1
          fi
          export ANDROID_USER_HOME="$RUNNER_TEMP/yawf-touch-player-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          test ! -e "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$EVIDENCE/ui"
          fixture_output="$RUNNER_TEMP/yawf-touch-player-fixture"
          emulator_pid=""
          fixture_pid=""
          instrumentation_status=99

          collect_logcat() {
            if [ -f "$EVIDENCE/player-logcat.txt" ]; then return 0; fi
            set +e
            timeout 20s adb -s "$EMULATOR_SERIAL" logcat -d -v threadtime -t 12000 2>/dev/null \
              | python3 -c '
          import re,sys
          url=re.compile(r"(?i)https?://[^\s\"\x27<>]+")
          capability=re.compile(r"(?i)/api/(?:external-)?stream/[^\s\"\x27<>]+")
          sensitive=re.compile(r"(?i)\b(?:authorization|proxy-authorization|cookie|set-cookie|bearer|ds_session|ds_csrf)\b")
          total=0
          for index,line in enumerate(sys.stdin):
              if index>=12000: break
              line=capability.sub("[redacted-capability]",line)
              line=url.sub("[redacted-url]",line)
              secret=sensitive.search(line)
              if secret is not None: line=line[:secret.start()]+"[redacted-sensitive]\n"
              encoded=line.encode("utf-8","replace")
              if total+len(encoded)>8*1024*1024: break
              sys.stdout.buffer.write(encoded); total+=len(encoded)
          ' > "$EVIDENCE/player-logcat.txt.part"
            pipeline_status=("${PIPESTATUS[@]}")
            if [ "${pipeline_status[1]}" -eq 0 ] && [ -s "$EVIDENCE/player-logcat.txt.part" ]; then
              mv "$EVIDENCE/player-logcat.txt.part" "$EVIDENCE/player-logcat.txt"
            else
              rm -f "$EVIDENCE/player-logcat.txt.part"
            fi
          }
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            if [ -n "$emulator_pid" ]; then
              collect_logcat
              if [ "$status" != 0 ] && [ "$(timeout 5s adb -s "$EMULATOR_SERIAL" emu avd name 2>/dev/null | tr -d '\r' | head -1)" = "$AVD_NAME" ]; then
                timeout 15s adb -s "$EMULATOR_SERIAL" exec-out screencap -p > "$EVIDENCE/workflow-failure.png"
                timeout 20s adb -s "$EMULATOR_SERIAL" shell uiautomator dump /data/local/tmp/yawf-touch-failure.xml > "$EVIDENCE/workflow-failure-dump.txt" 2>&1
                timeout 10s adb -s "$EMULATOR_SERIAL" exec-out cat /data/local/tmp/yawf-touch-failure.xml \
                  | sed -E 's#https?://[^[:space:]"<>]+#[redacted-url]#g' > "$EVIDENCE/workflow-failure.xml"
              fi
              timeout 10s adb -s "$EMULATOR_SERIAL" reverse --remove tcp:"$FIXTURE_APP_PORT" >/dev/null 2>&1
              timeout 10s adb -s "$EMULATOR_SERIAL" emu kill >/dev/null 2>&1
              kill "$emulator_pid" 2>/dev/null
              wait "$emulator_pid" 2>/dev/null
            fi
            if [ -n "$fixture_pid" ]; then
              kill "$fixture_pid" 2>/dev/null
              wait "$fixture_pid" 2>/dev/null
            fi
            for name in smoke-result.json media-probe.json touch-player-server-runtime.json; do
              if [ -f "$fixture_output/$name" ]; then cp "$fixture_output/$name" "$EVIDENCE/$name"; fi
            done
            printf 'workflowExit=%s\ninstrumentationExit=%s\nownedEmulatorStopAttempted=true\nownedFixtureStopAttempted=true\n' \
              "$status" "$instrumentation_status" > "$EVIDENCE/cleanup.txt"
            exit "$status"
          }
          trap cleanup EXIT

          FIXTURE_APP_PORT="$FIXTURE_APP_PORT" FIXTURE_MEDIA_PORT="$FIXTURE_MEDIA_PORT" \
            node touch-ui-source/server/node_modules/tsx/dist/cli.mjs scripts/android_touch_player_server_fixture.mts \
            --repo "$GITHUB_WORKSPACE/touch-ui-source" --output "$fixture_output" \
            > "$EVIDENCE/fixture.log" 2>&1 &
          fixture_pid=$!
          deadline=$((SECONDS + 180))
          until grep -Fq '[fixture] READY server-mode-ui loopback' "$EVIDENCE/fixture.log"; do
            kill -0 "$fixture_pid"
            test "$SECONDS" -lt "$deadline"
            sleep 1
          done

          printf 'no\n' | avdmanager create avd --name "$AVD_NAME" --package "$SYSTEM_IMAGE_PACKAGE" --device pixel_2
          emulator -avd "$AVD_NAME" -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim \
            -gpu swiftshader_indirect -feature -Vulkan -cores 2 -memory 2048 \
            > "$EVIDENCE/emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 300))
          until [ "$(timeout 5s adb -s "$EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator_pid"
            test "$SECONDS" -lt "$deadline"
            sleep 2
          done

          # Fail closed before installing any APK. This proves the owned fresh environment.
          test "$(adb -s "$EMULATOR_SERIAL" emu avd name | tr -d '\r' | head -1)" = "$AVD_NAME"
          test "$(adb -s "$EMULATOR_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" = 36
          test "$(adb -s "$EMULATOR_SERIAL" shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
          test "$(adb -s "$EMULATOR_SERIAL" shell getconf PAGE_SIZE | tr -d '\r')" = 4096
          if adb -s "$EMULATOR_SERIAL" shell pm path com.tgk30.debridstreamer | grep -q '^package:'; then
            echo 'Product package existed before the owned install' >&2
            exit 1
          fi
          if adb -s "$EMULATOR_SERIAL" shell pm path com.yawf.runtimeinstrumentation | grep -q '^package:'; then
            echo 'Harness package existed before the owned install' >&2
            exit 1
          fi
          adb -s "$EMULATOR_SERIAL" shell dumpsys account | python3 -c \
            'import sys,re; counts=re.findall(r"Accounts: (\d+)",sys.stdin.read()); assert counts and all(int(x)==0 for x in counts); print("androidAccountCount=0")' \
            > "$EVIDENCE/no-real-accounts.txt"
          adb -s "$EMULATOR_SERIAL" shell getprop > "$EVIDENCE/fresh-environment-properties.txt"

          # Admit only a quiet, healthy fresh OS before any APK is installed. These are
          # bounded read-only snapshots. Nothing is cleared, restarted, retried, or waived.
          health_dir="$EVIDENCE/preinstall-health"
          mkdir -p "$health_dir"
          capture_preinstall_health() {
            local name="$1"
            shift
            set +e
            timeout 20s "$@" 2>&1 | python3 -c '
          import re, sys
          maximum_bytes = 1024 * 1024
          maximum_lines = 4000
          url = re.compile(r"(?i)https?://[^\s\"\x27<>]+")
          sensitive = re.compile(r"(?i)\b(?:authorization|proxy-authorization|cookie|set-cookie|bearer|ds_session|ds_csrf)\b")
          seen_bytes = 0
          seen_lines = 0
          truncated = False
          for line in sys.stdin:
              seen_lines += 1
              cleaned = url.sub("[redacted-url]", line)
              secret = sensitive.search(cleaned)
              if secret is not None:
                  ending = "\n" if cleaned.endswith("\n") else ""
                  cleaned = cleaned[:secret.start()] + "[redacted-sensitive]" + ending
              encoded = cleaned.encode("utf-8", "replace")
              if seen_lines > maximum_lines or seen_bytes + len(encoded) > maximum_bytes:
                  truncated = True
                  continue
              sys.stdout.write(cleaned)
              seen_bytes += len(encoded)
          if truncated:
              raise SystemExit(23)
          ' > "$health_dir/$name.txt.part"
            local pipeline_status=("${PIPESTATUS[@]}")
            local capture_complete=false
            if [ "${pipeline_status[0]}" -eq 0 ] && [ "${pipeline_status[1]}" -eq 0 ]; then
              capture_complete=true
            fi
            printf '{"schemaVersion":1,"commandExit":%d,"redactorExit":%d,"complete":%s}\n' \
              "${pipeline_status[0]}" "${pipeline_status[1]}" "$capture_complete" \
              > "$health_dir/$name.status.json.part"
            mv "$health_dir/$name.status.json.part" "$health_dir/$name.status.json"
            set -e
            if [ "${pipeline_status[0]}" -ne 0 ] || [ "${pipeline_status[1]}" -ne 0 ]; then
              echo "Preinstall health capture failed or truncated: $name" >&2
              exit 1
            fi
            mv "$health_dir/$name.txt.part" "$health_dir/$name.txt"
          }

          system_server_pid_before="$(timeout 10s adb -s "$EMULATOR_SERIAL" shell pidof system_server | tr -d '\r')"
          [[ "$system_server_pid_before" =~ ^[0-9]+$ ]]
          quiet_started_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 15
          for tag in system_server_anr system_app_anr data_app_anr system_server_crash system_app_crash data_app_crash; do
            capture_preinstall_health "dropbox-$tag" adb -s "$EMULATOR_SERIAL" shell dumpsys dropbox --print "$tag"
          done
          capture_preinstall_health events adb -s "$EMULATOR_SERIAL" logcat -b events -d -v threadtime -t 4001
          capture_preinstall_health crash adb -s "$EMULATOR_SERIAL" logcat -b crash -d -v threadtime -t 4001
          system_server_pid_after="$(timeout 10s adb -s "$EMULATOR_SERIAL" shell pidof system_server | tr -d '\r')"
          [[ "$system_server_pid_after" =~ ^[0-9]+$ ]]
          test "$system_server_pid_before" = "$system_server_pid_after"
          quiet_finished_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          HEALTH_DIR="$health_dir" PID_BEFORE="$system_server_pid_before" PID_AFTER="$system_server_pid_after" \
            QUIET_START="$quiet_started_utc" QUIET_FINISH="$quiet_finished_utc" python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["HEALTH_DIR"])
          dropbox_tags = (
              "system_server_anr", "system_app_anr", "data_app_anr",
              "system_server_crash", "system_app_crash", "data_app_crash",
          )
          expected_names = {f"dropbox-{tag}.txt" for tag in dropbox_tags} | {"events.txt", "crash.txt"}
          actual_names = {path.name for path in root.glob("*.txt")}
          expected_status_names = {name.removesuffix(".txt") + ".status.json" for name in expected_names}
          actual_status_names = {path.name for path in root.glob("*.status.json")}
          findings = []
          diagnostic_errors = []
          stats = {}
          for name in sorted(expected_names - actual_names):
              diagnostic_errors.append(f"missing snapshot: {name}")
          for name in sorted(actual_names - expected_names):
              diagnostic_errors.append(f"unexpected snapshot: {name}")
          for name in sorted(expected_status_names - actual_status_names):
              diagnostic_errors.append(f"missing capture status: {name}")
          for name in sorted(actual_status_names - expected_status_names):
              diagnostic_errors.append(f"unexpected capture status: {name}")
          expected_capture_status = {
              "schemaVersion": 1, "commandExit": 0, "redactorExit": 0, "complete": True,
          }
          for name in sorted(expected_status_names & actual_status_names):
              try:
                  status = json.loads((root / name).read_text("utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as error:
                  diagnostic_errors.append(f"{name}: unreadable capture status ({type(error).__name__})")
                  continue
              if status != expected_capture_status:
                  diagnostic_errors.append(f"{name}: capture command failed, truncated, or incomplete")

          dropbox_summary = re.compile(r"(?m)^Drop box contents: [0-9]+ entr(?:y|ies)$")
          dropbox_search = re.compile(r"(?m)^Searching for: ([A-Za-z0-9_.:-]+)$")
          dropbox_entry = re.compile(
              r"(?m)^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)? "
              r"([A-Za-z0-9_.:-]+) \([^\r\n]+\)$"
          )
          allowed_dropbox_header = re.compile(
              r"^(?:Drop box contents: [0-9]+ entr(?:y|ies)|Max entries: [0-9]+|"
              r"Low priority rate limit period: [0-9]+ ms|Low priority tags: \{[^\r\n]*\}|"
              r"Searching for: [A-Za-z0-9_.:-]+|No entries found\.|\(No entries found\.\))$"
          )
          threadtime = re.compile(
              r"^\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3,6}\s+"
              r"\d+\s+\d+\s+[VDIWEFA]\s+([^:\s]+)\s*:\s?(.*)$"
          )
          event_entry = re.compile(r"(?i)^am_(?:anr|crash)$")
          crash_entry = re.compile(r"(?i)(?:FATAL EXCEPTION|Fatal signal\s+[0-9]+|crash_dump(?:32|64)?|Abort message|\bANR in\b)")

          def parse_dropbox(name, data):
              tag = name.removeprefix("dropbox-").removesuffix(".txt")
              summaries = dropbox_summary.findall(data)
              searches = dropbox_search.findall(data)
              if len(summaries) != 1:
                  diagnostic_errors.append(f"{name}: missing or ambiguous DropBox summary")
              if searches != [tag]:
                  diagnostic_errors.append(f"{name}: missing or mismatched DropBox filter header")
              prefix = data.split("========================================", 1)[0]
              for line in prefix.splitlines():
                  if line and not allowed_dropbox_header.fullmatch(line):
                      diagnostic_errors.append(f"{name}: malformed DropBox header")
                      break
              entries = dropbox_entry.findall(data)
              separators = sum(line == "========================================" for line in data.splitlines())
              if separators != len(entries):
                  diagnostic_errors.append(f"{name}: malformed retained DropBox entry")
              if any(entry != tag for entry in entries):
                  diagnostic_errors.append(f"{name}: retained entry does not match requested tag")
              if tag in entries:
                  findings.append(name)

          def parse_logcat(name, data):
              if name == "crash.txt" and data == "":
                  return
              parsed = []
              malformed = []
              banners = 0
              expected_buffer = "events" if name == "events.txt" else "crash"
              for line in data.splitlines():
                  if not line:
                      continue
                  banner = re.fullmatch(r"--------- beginning of (events|crash)", line)
                  if banner is not None:
                      if banner.group(1) == expected_buffer:
                          banners += 1
                      else:
                          malformed.append(line)
                      continue
                  match = threadtime.fullmatch(line)
                  if match is None:
                      malformed.append(line)
                  else:
                      parsed.append(match.groups())
              if not banners and not parsed:
                  diagnostic_errors.append(f"{name}: unavailable or empty logcat diagnostic")
              if malformed:
                  diagnostic_errors.append(f"{name}: malformed logcat diagnostic")
              if name == "events.txt":
                  if any(event_entry.fullmatch(tag) for tag, _message in parsed):
                      findings.append(name)
              elif any(crash_entry.search(f"{tag}: {message}") for tag, message in parsed):
                  findings.append(name)

          for name in sorted(expected_names & actual_names):
              path = root / name
              try:
                  raw = path.read_bytes()
                  data = raw.decode("utf-8")
              except (OSError, UnicodeError) as error:
                  diagnostic_errors.append(f"{name}: unreadable diagnostic ({type(error).__name__})")
                  continue
              lines = data.splitlines()
              stats[name] = {"bytes": len(raw), "lines": len(lines)}
              if len(lines) > 4000 or len(raw) > 1024 * 1024:
                  diagnostic_errors.append(f"{name}: snapshot exceeds retained bounds")
              if name.startswith("dropbox-"):
                  parse_dropbox(name, data)
              else:
                  parse_logcat(name, data)

          pid_before_text = os.environ.get("PID_BEFORE", "")
          pid_after_text = os.environ.get("PID_AFTER", "")
          valid_pid_before = re.fullmatch(r"[1-9][0-9]*", pid_before_text) is not None
          valid_pid_after = re.fullmatch(r"[1-9][0-9]*", pid_after_text) is not None
          if not valid_pid_before:
              diagnostic_errors.append("system_server PID before quiet window is unavailable or malformed")
          if not valid_pid_after:
              diagnostic_errors.append("system_server PID after quiet window is unavailable or malformed")
          stable_pid = valid_pid_before and valid_pid_after and pid_before_text == pid_after_text
          if valid_pid_before and valid_pid_after and not stable_pid:
              diagnostic_errors.append("system_server PID changed during quiet window")

          receipt = {
              "schemaVersion": 1,
              "admitted": not findings and not diagnostic_errors,
              "quietWindowSeconds": 15,
              "quietStartedUtc": os.environ["QUIET_START"],
              "quietFinishedUtc": os.environ["QUIET_FINISH"],
              "systemServerPidBefore": int(pid_before_text) if valid_pid_before else None,
              "systemServerPidAfter": int(pid_after_text) if valid_pid_after else None,
              "stableSystemServerPid": stable_pid,
              "anrOrCrashFindings": findings,
              "diagnosticErrors": diagnostic_errors,
              "snapshots": stats,
          }
          (root / "admission.json").write_text(json.dumps(receipt, indent=2) + "\n")
          if findings: raise SystemExit("Preinstall ANR/crash evidence observed; no waiver is allowed")
          if diagnostic_errors: raise SystemExit("Preinstall diagnostics unavailable or malformed; no waiver is allowed")
          PY
          printf 'freshAvd=true\npreinstallProductAbsent=true\npreinstallHarnessAbsent=true\napi=36\nabi=x86_64\npageSize=4096\npreinstallHealthAdmitted=true\nquietWindowSeconds=15\nstableSystemServerPid=true\n' \
            > "$EVIDENCE/preinstall-environment-gate.txt"

          adb -s "$EMULATOR_SERIAL" reverse tcp:"$FIXTURE_APP_PORT" tcp:"$FIXTURE_APP_PORT"
          adb -s "$EMULATOR_SERIAL" install "$PRODUCT_APK" | tee "$EVIDENCE/product-install.txt"
          grep -Eq '^Success\r?$' "$EVIDENCE/product-install.txt"
          installed="$(adb -s "$EMULATOR_SERIAL" shell pm path com.tgk30.debridstreamer | tr -d '\r' | sed -n 's/^package://p')"
          test -n "$installed"
          test "$(printf '%s\n' "$installed" | wc -l | tr -d ' ')" = 1
          test "$(adb -s "$EMULATOR_SERIAL" shell sha256sum "$installed" | awk '{print $1}')" = "$PRODUCT_SHA256"
          dumpsys_package="$(adb -s "$EMULATOR_SERIAL" shell dumpsys package com.tgk30.debridstreamer)"
          grep -Fq "versionName=$PRODUCT_VERSION" <<< "$dumpsys_package"
          grep -Fq "versionCode=$PRODUCT_VERSION_CODE_ACTUAL " <<< "$dumpsys_package"
          adb -s "$EMULATOR_SERIAL" install "$HARNESS_APP_APK" | tee "$EVIDENCE/harness-install.txt"
          grep -Eq '^Success\r?$' "$EVIDENCE/harness-install.txt"
          adb -s "$EMULATOR_SERIAL" install "$HARNESS_TEST_APK" | tee "$EVIDENCE/harness-test-install.txt"
          grep -Eq '^Success\r?$' "$EVIDENCE/harness-test-install.txt"

          set +e
          timeout 720s adb -s "$EMULATOR_SERIAL" shell am instrument -w -r \
            -e class com.yawf.runtimeinstrumentation.RuntimeTouchPlayerFlowTest \
            -e evidenceSubdir touch-player-flow \
            com.yawf.runtimeinstrumentation.test/androidx.test.runner.AndroidJUnitRunner \
            | sed -E 's#https?://[^[:space:]"<>]+#[redacted-url]#g' \
            | tee "$EVIDENCE/instrumentation.txt"
          instrumentation_status=${PIPESTATUS[0]}
          set -e
          cp "$fixture_output/touch-player-server-runtime.json" "$EVIDENCE/touch-player-server-runtime.json"
          cp "$fixture_output/media-probe.json" "$EVIDENCE/media-probe.json"
          cp "$fixture_output/smoke-result.json" "$EVIDENCE/smoke-result.json"

          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          evidence=Path(os.environ['EVIDENCE'])
          adb=['adb','-s',os.environ['EMULATOR_SERIAL']]
          run_as=['exec-out','run-as','com.yawf.runtimeinstrumentation']
          folder='files/touch-player-flow'
          names=subprocess.check_output(adb+run_as+['ls','-1',folder],text=True).splitlines()
          assert 0 < len(names) <= 64
          allowed=re.compile(r'(?:[0-9]{2}-[a-z0-9-]+\.(?:png|xml)|actions\.txt|instrumentation-touch-player-receipt\.json)')
          out=evidence/'ui'
          unexpected=[]
          for name in names:
              if not allowed.fullmatch(name): unexpected.append(name); continue
              data=subprocess.check_output(adb+run_as+['cat',folder+'/'+name])
              assert 0 < len(data) <= 8*1024*1024
              (out/name).write_bytes(data)
          assert not unexpected, unexpected
          receipt=json.loads((out/'instrumentation-touch-player-receipt.json').read_text())
          assert receipt['outcome']=='passed'
          checks=receipt['checks']
          for key in ['firstDecodeClockAdvanced','centralPauseResume','pausedBackForward',
                      'twoRealAudioTracksObserved','japaneseSelectionPersistedAfterHandoff',
                      'pausedSideDoubleTapSingleSeek','portraitLandscapePortrait',
                      'audioSelectionPersistedAcrossOrientation']:
              assert checks[key] is True, key
          assert checks['touchScrubDeltaSeconds'] >= 3
          server=json.loads((evidence/'touch-player-server-runtime.json').read_text())
          assert server['droppedEntries']==0
          events=server['events']
          assert any(e['phase']=='live' and e['route']=='proxy' and e['status'] in (200,206) and e['contentType']=='video-mp4' for e in events)
          assert any(e['phase']=='live' and e['route']=='audio-inventory' and e['status']==200 for e in events)
          assert any(e['phase']=='live' and e['route']=='hls-manifest' and e['status']==200 and e['audio']==1 and
                     e['playbackDecision']=='transcode' for e in events)
          assert any(e['phase']=='live' and e['route']=='hls-asset' and e['status']==200 and e['contentType'] in ('hls','video-mp2t') for e in events)
          PY
          node scripts/android_touch_player_receipt.mjs \
            --ui "$EVIDENCE/ui/instrumentation-touch-player-receipt.json" \
            --server "$EVIDENCE/touch-player-server-runtime.json" \
            --output "$EVIDENCE/touch-player-runtime-validation.json"
          test "$instrumentation_status" = 0
          grep -Eq '^OK \(1 test\)\r?$' "$EVIDENCE/instrumentation.txt"

          adb -s "$EMULATOR_SERIAL" shell dumpsys activity exit-info com.tgk30.debridstreamer \
            > "$EVIDENCE/product-exit-info.txt"
          if grep -Eqi 'REASON_ANR|reason=6|ANR in com\.tgk30\.debridstreamer' "$EVIDENCE/product-exit-info.txt"; then
            echo 'Product ANR observed; no waiver is allowed' >&2
            exit 1
          fi
          collect_logcat
          if grep -Eqi 'ANR in com\.tgk30\.debridstreamer|FATAL EXCEPTION.*com\.tgk30\.debridstreamer' "$EVIDENCE/player-logcat.txt"; then
            echo 'Product fatal or ANR observed; no waiver is allowed' >&2
            exit 1
          fi

          trap - EXIT
          cleanup

      - name: Retain bounded touch-player runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-phone58-touch-player59-runtime-evidence
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
