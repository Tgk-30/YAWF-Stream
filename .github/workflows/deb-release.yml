# Builds the DebridStreamer self-host server as a Debian/Ubuntu package and
# attaches it to the release. Runs on the same `v*-web` release tag as the
# desktop build; also uploadable as a workflow-dispatch artifact for testing.
#
# The package is Architecture: all (a Node bundle + static web assets, no native
# code), so a single .deb installs on amd64 and arm64. It Depends on nodejs; see
# deploy/ubuntu/README.md (Option C) for install steps.
name: deb-release

on:
  push:
    tags:
      - "v*-web"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test artifact smoke and cache guards
        run: node --test scripts/smoke_server_artifact.test.mjs scripts/service_worker_cache_contract.test.mjs

      - name: Build web app
        run: |
          cd web
          npm ci
          npm test
          npm audit --omit=dev
          npm run build

      - name: Build server
        run: |
          cd server
          npm ci
          npm test
          npm audit --omit=dev
          npm run build

      - name: Resolve and validate package version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./server/package.json').version")"
          if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "server/package.json has an invalid release version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-web)?$ ]]; then
              echo "release tag must be vX.Y.Z or vX.Y.Z-web" >&2
              exit 1
            fi
            tag_version="${BASH_REMATCH[1]}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "release tag version does not match server/package.json" >&2
              exit 1
            fi
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash scripts/build_deb.sh "$VERSION"

      - name: Add a stable-named alias
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: cp "dist-deb/debridstreamer-server_${VERSION}_all.deb" "dist-deb/debridstreamer-server_all.deb"

      - name: Smoke exact Debian package contents
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          candidate="dist-deb/debridstreamer-server_${VERSION}_all.deb"
          receipt="dist-deb/debridstreamer-server_${VERSION}_all.smoke.json"
          dpkg-deb --extract "$candidate" "$extracted"
          node scripts/smoke_server_artifact.mjs \
            --expected-version "$VERSION" \
            --server-entry "$extracted/opt/debridstreamer/server/dist/index.cjs" \
            --web-dist "$extracted/opt/debridstreamer/web-dist" \
            --receipt "$receipt"
          (
            cd dist-deb
            sha256sum \
              "debridstreamer-server_${VERSION}_all.deb" \
              debridstreamer-server_all.deb \
              "debridstreamer-server_${VERSION}_all.smoke.json" \
              > SHA256SUMS
          )

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: debridstreamer-server-deb
          path: |
            dist-deb/*.deb
            dist-deb/*.smoke.json
            dist-deb/SHA256SUMS

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist-deb/*.deb

  install-check:
    name: Installed server package (${{ matrix.runner }})
    needs: deb
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Install Node 24 and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs ffmpeg
          /usr/bin/node --version | grep -Eq '^v24\.'
          echo /usr/bin >> "$GITHUB_PATH"
          ffmpeg -version | sed -n '1p'

      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: debridstreamer-server-deb
          path: ${{ runner.temp }}/server-candidate

      - name: Verify and install exact candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./server/package.json').version")"
          candidate="$RUNNER_TEMP/server-candidate/debridstreamer-server_${expected_version}_all.deb"
          test -f "$candidate"
          (
            cd "$RUNNER_TEMP/server-candidate"
            sha256sum --check SHA256SUMS
          )
          test "$(dpkg-deb -f "$candidate" Architecture)" = "all"
          test "$(dpkg-deb -f "$candidate" Version)" = "$expected_version"
          depends="$(dpkg-deb -f "$candidate" Depends)"
          grep -Eq '(^|, )nodejs \(>= 24\)(,|$)' <<<"$depends"
          grep -Eq '(^|, )ffmpeg(,|$)' <<<"$depends"
          sudo apt-get install -y "$candidate"
          test "$(dpkg-query -W -f='${Version}' debridstreamer-server)" = "$expected_version"
          echo "SERVER_DEB=$candidate" >> "$GITHUB_ENV"
          echo "SERVER_VERSION=$expected_version" >> "$GITHUB_ENV"

      - name: Verify installed service metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f /opt/debridstreamer/server/dist/index.cjs
          test -f /opt/debridstreamer/web-dist/index.html
          test -f /lib/systemd/system/debridstreamer.service
          test -f /etc/debridstreamer/debridstreamer.env
          test "$(stat -c '%a' /etc/debridstreamer/debridstreamer.env)" = "600"
          test "$(stat -c '%U:%G' /var/lib/debridstreamer)" = "debridstreamer:debridstreamer"
          test "$(getent passwd debridstreamer | cut -d: -f6)" = "/var/lib/debridstreamer"
          systemctl is-enabled debridstreamer | grep -qx enabled
          grep -q '^User=debridstreamer$' /lib/systemd/system/debridstreamer.service
          grep -q '^NoNewPrivileges=true$' /lib/systemd/system/debridstreamer.service
          grep -q '^ProtectSystem=strict$' /lib/systemd/system/debridstreamer.service

      - name: Smoke exact installed payload as service user
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop debridstreamer
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cp "$GITHUB_WORKSPACE/scripts/smoke_server_artifact.mjs" "$smoke_dir/smoke_server_artifact.mjs"
          chmod 0755 "$smoke_dir"
          chmod 0644 "$smoke_dir/smoke_server_artifact.mjs"
          sudo -u debridstreamer node "$smoke_dir/smoke_server_artifact.mjs" \
            --expected-version "$SERVER_VERSION" \
            --server-entry /opt/debridstreamer/server/dist/index.cjs \
            --web-dist /opt/debridstreamer/web-dist \
            | tee "$RUNNER_TEMP/installed-server-smoke.json"

      - name: Start, restart, and inspect the systemd service
        shell: bash
        run: |
          set -euo pipefail
          port="$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")"
          setup_token="$(openssl rand -base64 32 | tr -d '\n')"
          sudo install -d -m 0755 /etc/systemd/system/debridstreamer.service.d
          sudo install -m 0600 /dev/null /etc/systemd/system/debridstreamer.service.d/10-ci-smoke.conf
          printf '%s\n' \
            '[Service]' \
            'Environment=HOST=127.0.0.1' \
            "Environment=PORT=$port" \
            "Environment=DS_SERVER_SETUP_TOKEN=$setup_token" \
            'Environment=DS_SERVER_COOKIE_SECURE=false' \
            'Environment=DS_SERVER_UPDATE_CHECK=false' \
            'Environment=DS_SERVER_ENABLE_DIRECT_TORRENT=false' \
            'Environment=DS_SERVER_ENABLE_TRANSCODE=false' \
            'Environment=DS_SERVER_LOGGER=false' \
            | sudo tee /etc/systemd/system/debridstreamer.service.d/10-ci-smoke.conf >/dev/null
          sudo chmod 0600 /etc/systemd/system/debridstreamer.service.d/10-ci-smoke.conf
          unset setup_token
          sudo systemctl daemon-reload
          sudo systemctl start debridstreamer

          wait_for_health() {
            for attempt in $(seq 1 80); do
              if curl --fail --silent "http://127.0.0.1:$port/api/health" \
                | grep -q '"ok":true'; then
                return 0
              fi
              if [ "$attempt" -eq 80 ]; then
                echo "Installed systemd service did not become healthy" >&2
                return 1
              fi
              sleep 0.25
            done
          }
          wait_for_health
          test "$(systemctl show debridstreamer --property=User --value)" = "debridstreamer"
          main_pid="$(systemctl show debridstreamer --property=MainPID --value)"
          test "$main_pid" -gt 1
          test "$(awk '/^Uid:/{print $2}' "/proc/$main_pid/status")" != "0"

          curl --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/systemd-index.headers" \
            --output "$RUNNER_TEMP/systemd-index.html" \
            "http://127.0.0.1:$port/"
          grep -Eqi '^content-type: text/html' "$RUNNER_TEMP/systemd-index.headers"
          grep -Eqi '^cache-control: no-store' "$RUNNER_TEMP/systemd-index.headers"
          curl --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/systemd-shim.headers" \
            --output "$RUNNER_TEMP/systemd-shim.js" \
            "http://127.0.0.1:$port/server-mode.js"
          grep -Eqi '^cache-control: no-store' "$RUNNER_TEMP/systemd-shim.headers"
          grep -Fq 'globalThis.__DEBRIDSTREAMER_SERVER_URL__ = globalThis.location.origin;' "$RUNNER_TEMP/systemd-shim.js"

          PORT="$port" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const base = `http://127.0.0.1:${process.env.PORT}`;
          const html = await (await fetch(`${base}/`)).text();
          const paths = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+\.(?:js|css))"/g)].map((match) => match[1]);
          assert.ok(paths.some((path) => path.endsWith(".js")));
          assert.ok(paths.some((path) => path.endsWith(".css")));
          for (const path of new Set(paths)) {
            assert.match(path, /-[A-Za-z0-9_-]{8,}\.(?:js|css)$/);
            const response = await fetch(`${base}${path}`);
            assert.equal(response.status, 200);
            assert.equal(response.headers.get("cache-control"), "public, max-age=31536000, immutable");
            assert.equal(response.headers.get("x-content-type-options"), "nosniff");
            const served = Buffer.from(await response.arrayBuffer());
            const packaged = await readFile(`/opt/debridstreamer/web-dist${path}`);
            const digest = (value) => createHash("sha256").update(value).digest("hex");
            assert.equal(digest(served), digest(packaged));
          }
          NODE

          sudo systemctl restart debridstreamer
          wait_for_health
          sudo systemctl stop debridstreamer
          service_state="$(systemctl is-active debridstreamer || true)"
          test "$service_state" = "inactive"

      - name: Upload install-check evidence
        uses: actions/upload-artifact@v4
        with:
          name: server-deb-install-check-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/installed-server-smoke.json
            ${{ runner.temp }}/systemd-index.headers
            ${{ runner.temp }}/systemd-shim.headers
