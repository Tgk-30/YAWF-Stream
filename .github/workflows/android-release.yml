# Independent Android phone candidate build. This never changes desktop latest.
# Publication remains an inspected draft followed by operator verification.
name: android-release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      verify_candidate_run:
        description: "Existing successful branch verification build run, blank to build a candidate"
        type: string
        default: ""
      verify_candidate_sha:
        description: "Exact candidate source SHA required with verify_candidate_run"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  android-app:
    name: Signed Android phone APK
    if: inputs.verify_candidate_run == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The phone app is a different artifact from the TV app: package
      # com.tgk30.debridstreamer against com.yawf.stream.tv, the whole Tauri
      # application against a WebView shell. Android ties upgrades to the
      # signing identity, so it gets its own key rather than borrowing the TV
      # one. A release requires the phone signing identity and artifact;
      # missing signing material must fail rather than silently omit Android.
      - name: Check phone signing secrets
        id: gate
        shell: bash
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
          ANDROID_APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_APP_KEYSTORE_BASE64 ANDROID_APP_KEYSTORE_PASSWORD ANDROID_APP_KEY_ALIAS ANDROID_APP_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::The mandatory Android phone signing material is missing."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned like the TV app (SEC-012). Once a key exists this is mandatory:
      # an unpinned signed APK is how a swapped identity ships unnoticed.
      - name: Require the pinned certificate digest
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s web/src-tauri/SIGNING_CERT_SHA256 ]; then
            echo "::error::web/src-tauri/SIGNING_CERT_SHA256 is missing. Commit the phone signing certificate SHA-256 before publishing a signed APK."
            exit 1
          fi

      - name: Set up JDK 17
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.ready == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        if: steps.gate.outputs.ready == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Expose build tools and NDK
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$sdk/build-tools/36.0.0"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          echo "$build_tools" >> "$GITHUB_PATH"
          ndk="$sdk/ndk/27.2.12479018"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$tc/aarch64-linux-android24-clang"
          {
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$tc/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$tc/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$tc/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
          echo "$tc" >> "$GITHUB_PATH"

      - name: Install Rust toolchain with Android targets
        if: steps.gate.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        if: steps.gate.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "web/src-tauri -> target"
          key: android-release
          cache-on-failure: true

      - name: Install Node for phone build
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        run: npm ci

      - name: Build the Android project
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        env:
          YAWF_GRADLE_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          yawf_gradle_api_token="$YAWF_GRADLE_API_TOKEN"
          unset YAWF_GRADLE_API_TOKEN
          npm run build
          npm run tauri -- android init --ci
          node ../scripts/patch_tauri_android.mjs
          YAWF_GRADLE_ARCHIVE="$(YAWF_GRADLE_API_TOKEN="$yawf_gradle_api_token" node ../scripts/fetch_android_gradle.mjs)"
          unset yawf_gradle_api_token
          export YAWF_GRADLE_ARCHIVE
          node ../scripts/prepare_android_gradle.mjs
          kotlin_maven_root="$(node ../scripts/fetch_android_kotlin_compiler.mjs "$RUNNER_TEMP/yawf-kotlin-m2")"
          kotlin_gradle_home="$(node ../scripts/prepare_android_kotlin_gradle.mjs "$kotlin_maven_root" "$RUNNER_TEMP/yawf-kotlin-gradle-home")"
          export GRADLE_USER_HOME="$kotlin_gradle_home"
          printf 'GRADLE_USER_HOME=%s\n' "$kotlin_gradle_home" >> "$GITHUB_ENV"
          npm run tauri -- android build --apk

      # Tauri's generated Gradle carries no signing config, so the release APK
      # comes out unsigned. Align and sign it here rather than patching a
      # generated file that the next Tauri version may reshape.
      - name: Sign and verify the phone APK
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
          ANDROID_APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          version="$(node -p "require('./web/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#android-v}"
            test "$tag_version" = "$version"
          fi
          ks="$RUNNER_TEMP/yawf-android-app.jks"
          printf '%s' "$ANDROID_APP_KEYSTORE_BASE64" | base64 --decode > "$ks"

          source="web/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          test -f "$source"
          aligned="$RUNNER_TEMP/aligned.apk"
          asset="$RUNNER_TEMP/YAWF.Stream_Android_${version}.apk"
          zipalign -P 16 -f 4 "$source" "$aligned"
          apksigner sign \
            --ks "$ks" \
            --ks-pass "env:ANDROID_APP_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_APP_KEY_ALIAS" \
            --key-pass "env:ANDROID_APP_KEY_PASSWORD" \
            --out "$asset" \
            "$aligned"
          apksigner verify "$asset"

          expected_digest="$(tr -d '[:space:]:' < web/src-tauri/SIGNING_CERT_SHA256 | tr '[:upper:]' '[:lower:]')"
          actual_digest="$(
            apksigner verify --print-certs "$asset" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -1 \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [ -z "$actual_digest" ] || [ "$actual_digest" != "$expected_digest" ]; then
            echo "::error::Phone APK signing certificate does not match web/src-tauri/SIGNING_CERT_SHA256"
            exit 1
          fi
          python3 scripts/verify_android_apk.py \
            --apk "$asset" \
            --version "$version" \
            --certificate-pin web/src-tauri/SIGNING_CERT_SHA256 \
            --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          rm -f "$ks"
          mkdir -p "$RUNNER_TEMP/phone-candidate"
          cp "$asset" "$RUNNER_TEMP/phone-candidate/"

      - name: Retain failed signed APK for private diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-failed-candidate
          path: ${{ runner.temp }}/YAWF.Stream_Android_*.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Build fixed-channel Android update metadata
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./web/package.json').version")"
          candidate="$RUNNER_TEMP/phone-candidate"
          node scripts/build_android_update_manifest.mjs \
            --apk "$candidate/YAWF.Stream_Android_${version}.apk" \
            --version "$version" --source "$GITHUB_SHA" \
            --output "$candidate/android-update.json"
          (cd "$candidate" && sha256sum "YAWF.Stream_Android_${version}.apk" android-update.json > SHA256SUMS)

      - name: Upload Android verification candidate
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-verification-candidate
          path: ${{ runner.temp }}/phone-candidate/*
          if-no-files-found: error
          retention-days: 3

      - name: Validate the Android API fixture producer
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        run: node --test scripts/prepare_android_tauri_api_fixture.test.mjs

      - name: Run the same build's API compile-JAR task
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        working-directory: web/src-tauri/gen/android
        run: ./gradlew --no-daemon --offline :tauri-android:bundleLibCompileToJarRelease

      - name: Bind the exact public Android API fixture
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path web/src-tauri/Cargo.toml --locked --offline --format-version 1 > "$RUNNER_TEMP/android-api-cargo-metadata.json"
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          metadata = json.loads((temporary / "android-api-cargo-metadata.json").read_text())
          packages = [p for p in metadata["packages"] if p["name"] == "tauri" and p["version"] == "2.12.4"]
          assert len(packages) == 1, "EXACT_TAURI_API_PACKAGE_REQUIRED"
          source = Path(packages[0]["manifest_path"]).parent
          home = Path(os.environ.get("CARGO_HOME", str(Path.home() / ".cargo")))
          archive = home / "registry/cache" / source.parent.name / "tauri-2.12.4.crate"
          task = ":tauri-android:bundleLibCompileToJarRelease"
          relative = Path("mobile/android/build/intermediates/compile_library_classes_jar/release/bundleLibCompileToJarRelease/classes.jar")
          jar = source / relative
          assert jar.is_file(), "EXACT_API_COMPILE_TASK_OUTPUT_REQUIRED"
          output = temporary / "phone-api-fixture"
          output.mkdir()
          subprocess.run([
              "python3", "scripts/prepare_android_tauri_api_fixture.py",
              "--cargo-lock", "web/src-tauri/Cargo.lock",
              "--crate-archive", str(archive), "--api-source", str(source),
              "--classes-jar", str(jar), "--output", str(output),
              "--build-environment", "gha-ubuntu24-jdk17-api-release",
          ], check=True)
          mapping = Path("web/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt")
          assert mapping.is_file() and mapping.stat().st_size <= 64 * 1024 * 1024, "BOUNDED_RELEASE_MAPPING_REQUIRED"
          shutil.copyfile(mapping, output / "android-r8-mapping.txt")
          version = json.loads(Path("web/package.json").read_text())["version"]
          apk = temporary / "phone-candidate" / ("YAWF.Stream_Android_" + version + ".apk")
          with (output / "plugin-runtime-code.txt").open("xb") as code:
              subprocess.run([
                  "apkanalyzer", "dex", "code", "--class", "app.tauri.plugin.Plugin", str(apk),
              ], stdout=code, check=True, timeout=90)
          assert (output / "plugin-runtime-code.txt").stat().st_size <= 2 * 1024 * 1024, "PLUGIN_CODE_BOUND"
          binding = {
              "schemaVersion": 1,
              "scope": "COMPILE_ONLY_API_OUTPUT_NOT_RUNTIME_QUALIFICATION",
              "source": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "gradleProject": ":tauri-android",
              "producerTask": task,
              "producerTaskInvokedInThisJob": True,
              "jarPathWithinVerifiedCrate": relative.as_posix(),
              "ordinaryApkBuildInSameJob": True,
              "freshCompilationClaim": False,
              "releaseMappingSha256": hashlib.sha256(mapping.read_bytes()).hexdigest(),
              "pluginRuntimeCodeSha256": hashlib.sha256((output / "plugin-runtime-code.txt").read_bytes()).hexdigest(),
              "minifiedHookAvailabilityClaim": False,
          }
          (output / "api-build-binding.json").write_text(json.dumps(binding, sort_keys=True) + "\n")
          PY
          (cd "$RUNNER_TEMP/phone-api-fixture" && sha256sum api-build-binding.json android-r8-mapping.txt plugin-runtime-code.txt >> SHA256SUMS)

      - name: Retain compile-only Android API fixture
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-api-fixture
          path: ${{ runner.temp }}/phone-api-fixture/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android release candidate
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-release-candidate
          path: ${{ runner.temp }}/phone-candidate/*
          if-no-files-found: error
          retention-days: 3


  owned-startup-runtime:
    name: Owned startup fault/retry on fresh API36
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.verify_candidate_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind the existing verification run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.verify_candidate_run }}
          CANDIDATE_SHA: ${{ inputs.verify_candidate_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run, source = os.environ['CANDIDATE_RUN'], os.environ['CANDIDATE_SHA']
          assert re.fullmatch(r'[1-9][0-9]{0,19}', run), 'RUN_ID_REQUIRED'
          assert re.fullmatch(r'[a-f0-9]{40}', source), 'SOURCE_SHA_REQUIRED'
          assert os.environ['GITHUB_REPOSITORY'] == 'Tgk-30/YAWF-Stream'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, os.environ['GITHUB_SHA']], check=True)
          prefix = 'repos/Tgk-30/YAWF-Stream/actions/runs/' + run
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], timeout=30))
          metadata = api(prefix)
          assert metadata['head_sha'] == source and metadata['event'] == 'workflow_dispatch'
          assert metadata['path'] == '.github/workflows/android-release.yml'
          assert metadata['status'] == 'completed' and metadata['conclusion'] == 'success'
          artifacts = api(prefix + '/artifacts')['artifacts']
          selected = {}
          for name, cap in [('android-phone-verification-candidate', 160*1024**2), ('android-phone-api-fixture', 8*1024**2)]:
              rows = [a for a in artifacts if a['name'] == name]
              assert len(rows) == 1 and not rows[0]['expired'] and 0 < rows[0]['size_in_bytes'] <= cap
              selected[name] = {key: rows[0][key] for key in ['id', 'name', 'size_in_bytes', 'digest']}
          output = Path(os.environ['RUNNER_TEMP']) / 'owned-startup-input'
          output.mkdir(mode=0o700)
          (output / 'candidate-run.json').write_text(json.dumps({'source': source, 'runId': run, 'artifacts': selected}, sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('phone_id='+str(selected['android-phone-verification-candidate']['id'])+'\n')
              f.write('api_id='+str(selected['android-phone-api-fixture']['id'])+'\n')
          PY

      - name: Download the exact ordinary candidate
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.phone_id }}
          merge-multiple: true
          run-id: ${{ inputs.verify_candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/owned-startup-input/phone

      - name: Download its compile-only API fixture
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.api_id }}
          merge-multiple: true
          run-id: ${{ inputs.verify_candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/owned-startup-input/api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare isolated test build tools
        env:
          YAWF_GRADLE_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$YAWF_GRADLE_API_TOKEN"
          unset YAWF_GRADLE_API_TOKEN
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          archive="$(YAWF_GRADLE_API_TOKEN="$token" node scripts/fetch_android_gradle.mjs)"
          unset token
          unzip -q "$archive" -d "$RUNNER_TEMP/owned-gradle"
          echo "$RUNNER_TEMP/owned-gradle/gradle-9.6.1/bin" >> "$GITHUB_PATH"
          echo 'GRADLE_USER_HOME='"$RUNNER_TEMP/owned-gradle-home" >> "$GITHUB_ENV"
          sudo chown "$(id -u):$(id -g)" /dev/kvm

      - name: Verify artifact content and prepare the test-only build
        env:
          CANDIDATE_RUN: ${{ inputs.verify_candidate_run }}
          CANDIDATE_SHA: ${{ inputs.verify_candidate_sha }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/owned-startup-input/phone" && sha256sum --strict -c SHA256SUMS)
          (cd "$RUNNER_TEMP/owned-startup-input/api" && sha256sum --strict -c SHA256SUMS)
          python3 -B scripts/prepare_android_owned_fault_alias.py \
            --inputs "$RUNNER_TEMP/owned-startup-input" \
            --source "$CANDIDATE_SHA" --run "$CANDIDATE_RUN" \
            --module scripts/android-owned-destroy-instrumentation \
            --output "$RUNNER_TEMP/owned-startup-build" --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

      - name: Compile only the instrumentation APK
        run: |
          set -euo pipefail
          export TAURI_ANDROID_API_CLASSES_JAR="$RUNNER_TEMP/owned-startup-input/api/tauri-android-api-classes.jar"
          export TAURI_ANDROID_API_CLASSES_JAR_SHA256
          TAURI_ANDROID_API_CLASSES_JAR_SHA256="$(sha256sum "$TAURI_ANDROID_API_CLASSES_JAR" | cut -d' ' -f1)"
          export TAURI_ANDROID_API_SOURCE_RECEIPT="$RUNNER_TEMP/owned-startup-input/api/api-source-receipt.json"
          gradle --no-daemon -p "$RUNNER_TEMP/owned-startup-build/module" :app:assembleDebugAndroidTest

      - name: Sign only the test APK with the matching phone identity
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
          ANDROID_APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ks="$RUNNER_TEMP/owned-test-only.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_APP_KEYSTORE_BASE64" | base64 --decode > "$ks"
          test -s "$ks"
          source="$RUNNER_TEMP/owned-startup-build/module/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$source"
          "$sdk/build-tools/36.0.0/zipalign" -P 16 -f 4 "$source" "$RUNNER_TEMP/owned-startup-build/aligned-test.apk"
          "$sdk/build-tools/36.0.0/apksigner" sign --ks "$ks" \
            --ks-pass env:ANDROID_APP_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_APP_KEY_ALIAS" \
            --key-pass env:ANDROID_APP_KEY_PASSWORD \
            --out "$RUNNER_TEMP/owned-startup-build/test-signed.apk" "$RUNNER_TEMP/owned-startup-build/aligned-test.apk"
          "$sdk/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/owned-startup-build/test-signed.apk"
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'owned-startup-build'
          receipt = root / 'TEST-BUILD-BINDING.json'
          binding = json.loads(receipt.read_text())
          apk = root / 'test-signed.apk'
          code = subprocess.check_output(['apkanalyzer', 'dex', 'code', '--class',
              'com.yawf.ownedstartup.FaultOncePlugin', str(apk)], timeout=90)
          assert len(code) <= 131072, 'TEST_CLASS_CODE_BOUND'
          text = code.decode('utf8')
          assert re.search(r'^\.class .* Lcom/yawf/ownedstartup/FaultOncePlugin;$', text, re.M), 'TEST_FAULT_CLASS_REQUIRED'
          for method in {'load', binding['faultAlias']}:
              assert re.findall(r'^\.method public ' + re.escape(method) + r'\(Landroid/webkit/WebView;\)V$', text, re.M) == [
                  '.method public '+method+'(Landroid/webkit/WebView;)V'], 'TEST_ALIAS_DEFINITION_REQUIRED'
          binding['finalTestApk'] = {'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'bytes': apk.stat().st_size}
          binding['finalTestFaultCodeSha256'] = hashlib.sha256(code).hexdigest()
          binding['finalTestAliasAndLoadDefined'] = True
          sdk = Path(os.environ.get('ANDROID_SDK_ROOT', os.environ['ANDROID_HOME']))
          badging = subprocess.check_output([str(sdk/'build-tools/36.0.0/aapt'), 'dump', 'badging', str(apk)], timeout=30)
          assert len(badging) <= 131072, 'TEST_APK_BADGING_BOUND'
          (root / 'test-apk-badging.txt').write_bytes(badging)
          binding['testApkBadgingSha256'] = hashlib.sha256(badging).hexdigest()
          receipt.write_text(json.dumps(binding, sort_keys=True)+'\n')
          (root / 'test-fault-runtime-code.txt').write_bytes(code)
          PY

      - name: Run one selected fault and one native Retry
        env:
          CANDIDATE_SHA: ${{ inputs.verify_candidate_sha }}
        run: |
          set -euo pipefail
          certificate="$(tr -d '[:space:]:' < web/src-tauri/SIGNING_CERT_SHA256 | tr '[:upper:]' '[:lower:]')"
          python3 -B scripts/run_android_owned_startup_hosted.py \
            --sdk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            --target-apk "$RUNNER_TEMP/owned-startup-input/phone/YAWF.Stream_Android_2.3.112.apk" \
            --test-apk "$RUNNER_TEMP/owned-startup-build/test-signed.apk" \
            --source "$CANDIDATE_SHA" --certificate "$certificate" \
            --job-root "$RUNNER_TEMP/owned-startup-runtime" \
            --build-binding "$RUNNER_TEMP/owned-startup-build/TEST-BUILD-BINDING.json"

      - name: Retain scoped hosted verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-owned-startup-runtime-evidence
          path: |
            ${{ runner.temp }}/owned-startup-input/candidate-run.json
            ${{ runner.temp }}/owned-startup-build/TEST-BUILD-BINDING.json
            ${{ runner.temp }}/owned-startup-build/*runtime-code.txt
            ${{ runner.temp }}/owned-startup-build/test-apk-badging.txt
            ${{ runner.temp }}/owned-startup-runtime/ROOT-LIFECYCLE.json
            ${{ runner.temp }}/owned-startup-runtime/owned-admission.json
            ${{ runner.temp }}/owned-startup-runtime/evidence/*.json
            ${{ runner.temp }}/owned-startup-runtime/logs/*.log
          if-no-files-found: warn
          retention-days: 3
